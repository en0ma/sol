name: Sixth Venue Raydium CLMM Official SDK Price-Parity Research
on:
  pull_request:
    paths:
      - "tools/raydium_clmm_official_sdk_oracle.js"
      - "arb/raydium_clmm_native_single_tick.py"
      - "arb/raydium_clmm_tick_source.py"
      - ".github/workflows/raydium-clmm-sixth-sdk.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sixth-clmm-sdk-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  clmm-official-sdk-vs-native:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/clmm-sixth-sdk-rpc
    steps:
      - uses: actions/checkout@v4
      - name: Require read-only mainnet source
        run: test -n "$SOLANA_RPC_URL"
      - name: Install decoder and pinned official SDK
        run: |
          python3 -m pip install --disable-pip-version-check solders==0.26.0
          npm install --no-save --package-lock=false @raydium-io/raydium-sdk-v2@0.2.75-alpha
      - name: Authenticate pool vaults and AMM configuration
        run: |
          python3 -m arb.raydium_clmm_sixth_venue_source \
            --rpc "$SOLANA_RPC_URL" --registry arb/pool_registry.json \
            --count 1 --output "$RUNNER_TEMP/clmm-source.json"
      - name: Capture synchronized liquidity ticks and config
        run: |
          python3 -m arb.raydium_clmm_sixth_tick_capture \
            --source "$RUNNER_TEMP/clmm-source.json" \
            --rpc "$SOLANA_RPC_URL" --radius 4 \
            --output "$RUNNER_TEMP/clmm-ticks.json"
      - name: Independently quote Q64 integer single tick math
        run: |
          python3 -m arb.raydium_clmm_native_single_tick \
            --tick-source "$RUNNER_TEMP/clmm-ticks.json" \
            --output "$RUNNER_TEMP/clmm-native.json"
      - name: Independently compare official Raydium SDK on the exact authenticated state
        run: |
          node tools/raydium_clmm_official_sdk_oracle.js \
            "$RUNNER_TEMP/clmm-ticks.json" \
            "$RUNNER_TEMP/clmm-native.json" \
            "$RUNNER_TEMP/clmm-official-sdk.json"
      - name: Install Surfpool for real isolated signed CLMM SwapV2
        run: |
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Start isolated offline Surfpool
        run: |
          set -euo pipefail
          nohup surfpool start --ci --offline --no-deploy > "$RUNNER_TEMP/clmm-surfpool.log" 2>&1 < /dev/null &
          python3 - <<'PY'
          import time,json,urllib.request
          for _ in range(90):
              try:
                  req=urllib.request.Request("http://127.0.0.1:8899",
                     data=json.dumps({"jsonrpc":"2.0","id":1,
                                      "method":"getHealth","params":[]}).encode(),
                     headers={"Content-Type":"application/json"})
                  with urllib.request.urlopen(req,timeout=2) as r:
                      if json.load(r).get("result")=="ok":break
              except (OSError,ValueError):pass
              time.sleep(1)
          else:raise SystemExit("CLMM offline Surfpool startup failed")
          PY
      - name: Execute four actual signed CLMM swap_v2 program instructions
        run: |
          python3 -m arb.raydium_clmm_sixth_signed_fork \
            --source-rpc "$SOLANA_RPC_URL" \
            --surfpool-rpc http://127.0.0.1:8899 \
            --tick-source "$RUNNER_TEMP/clmm-ticks.json" \
            --native "$RUNNER_TEMP/clmm-native.json" \
            --sdk "$RUNNER_TEMP/clmm-official-sdk.json" \
            --output "$RUNNER_TEMP/clmm-signed.json"
      - name: Independently audit Ed25519 SwapV2 and raw SPL output
        run: |
          python3 -m arb.raydium_clmm_sixth_signed_audit \
            --tick-source "$RUNNER_TEMP/clmm-ticks.json" \
            --sdk "$RUNNER_TEMP/clmm-official-sdk.json" \
            --signed "$RUNNER_TEMP/clmm-signed.json" \
            --output "$RUNNER_TEMP/clmm-independent-signed-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sixth-clmm-sdk-native-research
          path: |
            ${{ runner.temp }}/clmm-source.json
            ${{ runner.temp }}/clmm-ticks.json
            ${{ runner.temp }}/clmm-native.json
            ${{ runner.temp }}/clmm-official-sdk.json
            ${{ runner.temp }}/clmm-signed.json
            ${{ runner.temp }}/clmm-independent-signed-audit.json
            ${{ runner.temp }}/clmm-surfpool.log
          if-no-files-found: warn
