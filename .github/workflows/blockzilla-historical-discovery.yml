name: Blockzilla bounded historical discovery experiment
on:
  workflow_dispatch:
    inputs:
      start_slot:
        description: "HTTP first slot; 0 = automatic"
        type: string
        default: "0"
      blocks:
        description: "HTTP slots (1–8)"
        type: string
        default: "6"
      archive_epoch:
        description: "Fallback public Compact V2 epoch"
        type: string
        default: "1094"
      archive_first_block:
        description: "Fallback first archive block row, not a slot"
        type: string
        default: "0"
  pull_request:
    paths:
      - "arb/blockzilla_discovery.py"
      - "arb/blockzilla_native_archive.py"
      - "arb/blockzilla_ci_gate.py"
      - "arb/blockzilla_rpc_comparison.py"
      - "ci/build_blockzilla_reader.sh"
      - "tests/test_blockzilla*"
      - ".github/workflows/blockzilla-historical-discovery.yml"
permissions:
  contents: read
concurrency:
  group: blockzilla-discovery-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m pip install --disable-pip-version-check solders==0.26.0
          bash -n ci/build_blockzilla_reader.sh
          python3 -m py_compile arb/blockzilla_discovery.py arb/blockzilla_native_archive.py arb/blockzilla_ci_gate.py arb/blockzilla_rpc_comparison.py
          python3 -m unittest discover -s tests -p 'test_blockzilla*.py' -v
  http-probe:
    needs: unit
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      usable: ${{ steps.scan.outputs.usable }}
    env:
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_PACING_FILE: /tmp/blockzilla-rpc-pacing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/blockzilla-http"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Probe HTTP and independently cross-check finalized records
        id: scan
        env:
          BLOCKZILLA_INDEPENDENT_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
          START_SLOT: ${{ inputs.start_slot || '0' }}
          BLOCKS: ${{ inputs.blocks || '6' }}
        run: |
          test -n "$BLOCKZILLA_INDEPENDENT_RPC_URL"
          set +e
          python3 -m arb.blockzilla_discovery scan --start-slot "$START_SLOT" \
            --blocks "$BLOCKS" --output "$RUNNER_TEMP/blockzilla-http/historical-hints.json"
          code=$?
          set -e
          python3 -m arb.blockzilla_ci_gate route \
            --report "$RUNNER_TEMP/blockzilla-http/historical-hints.json" \
            --exit-code "$code" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockzilla-http-probe
          path: ${{ runner.temp }}/blockzilla-http/*.json
          if-no-files-found: warn
          retention-days: 7
  native-archive:
    needs: [unit, http-probe]
    if: needs.http-probe.outputs.usable == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: blockzilla-dev/blockzilla
          ref: c8265ad3e61a36e8f8f2dee49020f6bb0f01f220
          path: upstream-blockzilla
          persist-credentials: false
      - name: Build pinned public archive reader (no RPC secrets)
        timeout-minutes: 14
        run: |
          mkdir -p "$RUNNER_TEMP/blockzilla-native"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
          bash ci/build_blockzilla_reader.sh upstream-blockzilla "$RUNNER_TEMP/blockzilla-native"
      - name: Scan bounded archive rows for seven venue programs
        timeout-minutes: 20
        env:
          ARCHIVE_EPOCH: ${{ inputs.archive_epoch || '1094' }}
          FIRST_BLOCK: ${{ inputs.archive_first_block || '0' }}
        run: |
          python3 -m arb.blockzilla_native_archive read \
            --binary upstream-blockzilla/target/debug/blockzilla \
            --directory "$RUNNER_TEMP/blockzilla-native" \
            --epoch "$ARCHIVE_EPOCH" --first-block "$FIRST_BLOCK" --blocks 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockzilla-native-archive
          path: ${{ runner.temp }}/blockzilla-native/
          if-no-files-found: warn
          retention-days: 7
  source-authentication:
    needs: [unit, http-probe, native-archive]
    if: always() && needs.unit.result == 'success' && needs.http-probe.result == 'success' && (needs.http-probe.outputs.usable == 'true' || needs.native-archive.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_PACING_FILE: /tmp/blockzilla-rpc-pacing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/blockzilla"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
      - uses: actions/download-artifact@v4
        if: needs.http-probe.outputs.usable == 'true'
        with:
          name: blockzilla-http-probe
          path: ${{ runner.temp }}/blockzilla
      - uses: actions/download-artifact@v4
        if: needs.http-probe.outputs.usable == 'false'
        with:
          name: blockzilla-native-archive
          path: ${{ runner.temp }}/blockzilla-native
      - name: Verify native archive leads against finalized RPC
        if: needs.http-probe.outputs.usable == 'false'
        env:
          BLOCKZILLA_INDEPENDENT_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
        run: |
          test -n "$BLOCKZILLA_INDEPENDENT_RPC_URL"
          python3 -m arb.blockzilla_native_archive check \
            --directory "$RUNNER_TEMP/blockzilla-native" \
            --output "$RUNNER_TEMP/blockzilla/historical-hints.json"
      - name: Start existing read-only source fork
        env:
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
        run: |
          test -n "$SURFPOOL_DATASOURCE_RPC_URL"
          bash ci/install_surfpool.sh
          nohup "$HOME/.local/bin/surfpool" start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/blockzilla-source.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/blockzilla-source.pid"
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(80):
              try:
                  assert call("http://127.0.0.1:8899", "getLatestBlockhash", timeout=3, retries=0)["value"]["blockhash"]
                  break
              except (ValueError, RuntimeError, OSError, KeyError):
                  time.sleep(1)
          else:
              raise SystemExit("source fork unavailable")
          PY
      - name: Authenticate novel pools and compare hint topology
        run: |
          python3 -m arb.blockzilla_discovery authenticate \
            --hints "$RUNNER_TEMP/blockzilla/historical-hints.json" \
            --output "$RUNNER_TEMP/blockzilla/source-authentication.json"
      - name: Measure same-window direct RPC control (separate from archive acceptance)
        if: needs.http-probe.outputs.usable == 'false'
        env:
          BLOCKZILLA_INDEPENDENT_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
        run: |
          python3 -m arb.blockzilla_rpc_comparison \
            --archive-directory "$RUNNER_TEMP/blockzilla-native" \
            --evidence-directory "$RUNNER_TEMP/blockzilla"
      - name: Stop source fork
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/blockzilla-source.pid"; then
            kill "$(cat "$RUNNER_TEMP/blockzilla-source.pid")" || true
          fi
      - name: Upload experimental evidence (never primary inventory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockzilla-historical-discovery-evidence
          path: ${{ runner.temp }}/blockzilla/*.json
          if-no-files-found: warn
          retention-days: 7
  evidence-gate:
    needs: [unit, http-probe, native-archive, source-authentication]
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Require the selected retrieval path and source job to have completed
        env:
          HTTP_RESULT: ${{ needs.http-probe.result }}
          HTTP_ROUTE: ${{ needs.http-probe.outputs.usable }}
          NATIVE_RESULT: ${{ needs.native-archive.result }}
          SOURCE_RESULT: ${{ needs.source-authentication.result }}
        run: |
          python3 -m arb.blockzilla_ci_gate jobs --http "$HTTP_RESULT" \
            --route "$HTTP_ROUTE" --native "$NATIVE_RESULT" --source "$SOURCE_RESULT"
      - uses: actions/download-artifact@v4
        with:
          name: blockzilla-historical-discovery-evidence
          path: ${{ runner.temp }}/blockzilla-evidence
      - name: Reconcile actual historical and source-authentication evidence
        env:
          HTTP_ROUTE: ${{ needs.http-probe.outputs.usable }}
        run: |
          python3 -m arb.blockzilla_ci_gate evidence \
            --directory "$RUNNER_TEMP/blockzilla-evidence" --route "$HTTP_ROUTE"
