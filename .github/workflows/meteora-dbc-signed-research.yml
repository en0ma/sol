name: Meteora DBC Original Signed Offline Research
on:
  pull_request:
    paths:
      - ".github/workflows/meteora-dbc-signed-research.yml"
      - "arb/meteora_dbc_signed_fork_research.py"
      - "arb/meteora_dbc_swap.py"
      - "tests/test_meteora_dbc_swap.py"
      - "tests/test_meteora_dbc_signed_fork_research.py"
      - "arb/meteora_dbc_signed_audit.py"
      - "tests/test_meteora_dbc_signed_audit.py"
      - "arb/meteora_dbc_signed_registry_merge.py"
      - "tests/test_meteora_dbc_signed_registry_merge.py"
      - "arb/meteora_dbc_native_fee.py"
      - "arb/meteora_dbc_native_fee_parity.py"
      - "tests/test_meteora_dbc_native_fee.py"
  workflow_dispatch:
    inputs:
      pool_count:
        description: "Independently sourced original SPL DBC pools: 1 or 6"
        required: false
        type: choice
        options:
          - "1"
          - "6"
        default: "1"
concurrency:
  group: dbc-signed-offline-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  dbc-genuine-signed-research:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SOLANA_MAINNET_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/dbc-signed-source-pacing
      SURFPOOL_EXPLICITLY_OFFLINE: "1"
      POOL_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.pool_count || '1' }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install --disable-pip-version-check solders==0.26.0
          python3 -m unittest discover -s tests -p test_meteora_dbc_swap.py -v
          python3 -m unittest discover -s tests -p test_meteora_dbc_signed_fork_research.py -v
          python3 -m unittest discover -s tests -p test_meteora_dbc_signed_audit.py -v
          python3 -m unittest discover -s tests -p test_meteora_dbc_signed_registry_merge.py -v
          python3 -m unittest discover -s tests -p test_meteora_dbc_native_fee.py -v
          python3 -m py_compile arb/meteora_dbc_signed_fork_research.py
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/dbc-sdk" @meteora-ag/dynamic-bonding-curve-sdk@2.0.0
      - name: Install isolated Surfpool
        run: |
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Launch and pause offline localhost before source snapshot
        run: |
          nohup surfpool start --ci --offline --no-deploy > "$RUNNER_TEMP/dbc-surfpool.log" 2>&1 < /dev/null &
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(90):
              try:
                  if call("http://127.0.0.1:8899","getHealth",[],retries=0)=="ok":
                      break
              except (OSError,ValueError,RuntimeError): pass
              time.sleep(1)
          else:raise SystemExit("DBC isolated Surfpool not available")
          call("http://127.0.0.1:8899","surfnet_pauseClock",[])
          PY
      - name: Capture one authentic original DBC source without broadcast
        env:
          NODE_PATH: ${{ runner.temp }}/dbc-sdk/node_modules
        run: |
          test -n "$SOLANA_MAINNET_RPC_URL"
          if [[ "$POOL_COUNT" == "6" ]]; then
            python3 -m arb.meteora_dbc_six_source_qualification \
              --rpc "$SOLANA_MAINNET_RPC_URL" --pages 12 \
              --output "$RUNNER_TEMP/dbc-signed-diagnostic-source.json"
          else
            python3 -m arb.meteora_dbc_seventh_candidate_capture \
              --rpc "$SOLANA_MAINNET_RPC_URL" --count 1 --pages 12 --sdk-screen \
              --output "$RUNNER_TEMP/dbc-signed-diagnostic-source.json"
          fi
      - name: Independently audit saved source bytes
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from arb.meteora_dbc_seventh_source_audit import independently_audit
          root=Path(os.environ["RUNNER_TEMP"])
          report=json.loads((root/"dbc-signed-diagnostic-source.json").read_text())
          if report.get("status")=="SIX_DBC_ORIGINAL_SOURCE_POOLS_ONLY":
              assert report["independent_audit"]["authenticated_source_pools"]==6
              source=report["source"]
          else:
              source=report
          audit=independently_audit(source)
          if len(source["source_pools"])!=audit["authenticated_source_pools"]:
              raise SystemExit("DBC source audit cardinality mismatch")
          (root/"dbc-independent-source.json").write_text(json.dumps(audit,indent=2)+"\n")
          print(json.dumps({"authenticated_source_pools":audit["authenticated_source_pools"]}))
          PY
      - name: Obtain source-bound original official SDK quote candidates
        env:
          NODE_PATH: ${{ runner.temp }}/dbc-sdk/node_modules
        run: |
          node tools/meteora_dbc_official_sdk_oracle.js \
            "$RUNNER_TEMP/dbc-signed-diagnostic-source.json" \
            "$RUNNER_TEMP/dbc-signed-diagnostic-sdk.json"
      - name: Independently reconcile original zero-fee curve mathematics
        run: |
          python3 -m arb.meteora_dbc_native_curve_audit \
            --source "$RUNNER_TEMP/dbc-signed-diagnostic-source.json" \
            --sdk "$RUNNER_TEMP/dbc-signed-diagnostic-sdk.json" \
            --output "$RUNNER_TEMP/dbc-signed-diagnostic-curve.json"
      - name: Independently require native full-fee original SDK parity before signing
        run: |
          python3 -m arb.meteora_dbc_native_fee_parity \
            --source "$RUNNER_TEMP/dbc-signed-diagnostic-source.json" \
            --sdk "$RUNNER_TEMP/dbc-signed-diagnostic-sdk.json" \
            --output "$RUNNER_TEMP/dbc-signed-diagnostic-native-fee.json"
      - name: Diagnostic only real Ed25519-signed isolated four-swap execution
        run: |
          python3 -m arb.meteora_dbc_signed_fork_research \
            --source-rpc "$SOLANA_MAINNET_RPC_URL" \
            --surfpool-rpc http://127.0.0.1:8899 \
            --source "$RUNNER_TEMP/dbc-signed-diagnostic-source.json" \
            --sdk "$RUNNER_TEMP/dbc-signed-diagnostic-sdk.json" \
            --curve "$RUNNER_TEMP/dbc-signed-diagnostic-native-fee.json" \
            --required "$POOL_COUNT" \
            --output "$RUNNER_TEMP/dbc-signed-diagnostic-unaccepted.json"
      - name: Independently reparse Ed25519 intent and raw SPL poststates
        run: |
          python3 -m arb.meteora_dbc_signed_audit \
            --source "$RUNNER_TEMP/dbc-signed-diagnostic-source.json" \
            --sdk "$RUNNER_TEMP/dbc-signed-diagnostic-sdk.json" \
            --native "$RUNNER_TEMP/dbc-signed-diagnostic-native-fee.json" \
            --signed "$RUNNER_TEMP/dbc-signed-diagnostic-unaccepted.json" \
            --required "$POOL_COUNT" \
            --output "$RUNNER_TEMP/dbc-independent-genuine-signed-audit.json"
      - name: Gate original independently audited signed DBC pool into existing registry artifact
        run: |
          python3 -m arb.meteora_dbc_signed_registry_merge \
            --registry arb/pool_registry.json \
            --source "$RUNNER_TEMP/dbc-signed-diagnostic-source.json" \
            --sdk "$RUNNER_TEMP/dbc-signed-diagnostic-sdk.json" \
            --native "$RUNNER_TEMP/dbc-signed-diagnostic-native-fee.json" \
            --signed "$RUNNER_TEMP/dbc-signed-diagnostic-unaccepted.json" \
            --required "$POOL_COUNT" \
            --output "$RUNNER_TEMP/dbc-signed-qualified-registry.json" \
            --report "$RUNNER_TEMP/dbc-signed-registry-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbc-signed-offline-research-unaccepted
          path: |
            ${{ runner.temp }}/dbc-signed-diagnostic-*.json
            ${{ runner.temp }}/dbc-independent-source.json
            ${{ runner.temp }}/dbc-independent-genuine-signed-audit.json
            ${{ runner.temp }}/dbc-signed-qualified-registry.json
            ${{ runner.temp }}/dbc-signed-registry-report.json
            ${{ runner.temp }}/dbc-surfpool.log
          if-no-files-found: warn
