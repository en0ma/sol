name: AMM v4 Focused Atomic CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: amm-v4-focused-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  fast-safety-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install builder dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
