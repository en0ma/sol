          temp=Path(os.environ["RUNNER_TEMP"])
          read=lambda name:json.loads((temp/name).read_text())
          receipts=temp/"m5-four-to-six-signed-attempt"
          promoted=promote_signed(
              json.loads(Path("arb/pool_registry.json").read_text()),
              read("venue-six-new-pools.json"),
              json.loads((receipts/"orca-new-pools-signed.json").read_text()),
              json.loads((receipts/"meteora-six-new-signed.json").read_text()),
              raydium_candidates=read("raydium-cpmm-candidates.json"),
              raydium_receipt=json.loads((receipts/"raydium-cpmm-native-signed.json").read_text()),
              required=6)
          target=temp/"signed-verified-expanded-pool-registry.json"
          target.write_text(json.dumps(promoted,indent=2)+"\n")
          print(json.dumps({"status":"SIGNED_PRICING_REGISTRY_ADMISSION",
              "total_registered_pools":len(promoted["pools"])}))
          PY
      - name: Export three-venue signed-verified pool registry for promotion
        if: ${{ matrix.shard == 0 }}
