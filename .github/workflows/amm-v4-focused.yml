name: AMM v4 Focused Atomic CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: amm-v4-focused-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  fast-safety-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install builder dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Test shared 2-to-6 offline signing and ordered intermediate-account linkage
        run: python3 -m unittest discover -s tests -p test_adaptive_n_leg_packet.py -v
      - name: Test signed N-leg SPL amount and rollback reconciliation
        run: python3 -m unittest discover -s tests -p test_adaptive_n_leg_balances.py -v
      - name: Test adaptive signed observation into existing coordinator
        run: python3 -m unittest discover -s tests -p test_adaptive_runner_coordinator.py -v
      - name: Test generic adaptive coordinator and existing venue compiler
        run: python3 -m unittest discover -s tests -p test_adaptive_compiler_integration.py -v
      - name: Test general 2-to-6 leg signed-observation adaptive planning
        run: python3 -m unittest discover -s tests -p test_adaptive_route_amount_planner.py -v
      - name: Test all-venue signed adaptive research acceptance
        run: python3 -m unittest discover -s tests -p test_m5_all_venue_adaptive_acceptance.py -v
      - name: Test independent adaptive signed amount-continuity acceptance
        run: python3 -m unittest discover -s tests -p test_m5_adaptive_signed_acceptance.py -v
      - name: Test signed first-leg adaptive amount preflight
        run: python3 -m unittest discover -s tests -p test_m5_adaptive_cpmm_v4.py -v
      - name: Test empirical signed quote and creator-fee blocker summary
        run: python3 -m unittest discover -s tests -p test_m5_experiment_blocker_summary.py -v
      - name: Test signed declared input versus actual SPL token consumption
        run: python3 -m unittest discover -s tests -p test_m5_signed_amount_declarations.py -v
      - name: Test source-derived CPMM creator-fee and observed compute evidence
        run: python3 -m unittest discover -s tests -p test_m5_captured_fee_compute_audit.py -v
      - name: Test focused real-source fixture receipt batch assessment
        run: python3 -m unittest discover -s tests -p test_m5_focused_signed_experiment_batch.py -v
      - name: Test reproducible fixture-to-signed receipt experiment diagnostics
        run: python3 -m unittest discover -s tests -p test_m5_signed_fixture_experiment_report.py -v
      - name: Test native account-derived CPMM/AMM v4 two-leg quote parity and observed cost risk
        run: python3 -m unittest discover -s tests -p test_cpmm_ammv4_signed_experiment.py -v
      - name: Validate consolidated three-priority signed experiment acceptance gates
        run: python3 -m unittest discover -s tests -p test_m5_experiment_acceptance.py -v
      - name: Prevent unsigned simulated PnL and enumerate all missing tick arrays
        run: python3 -m unittest discover -s tests -p test_m5_signed_risk_tick_gap_regressions.py -v
      - name: Test captured PumpSwap fee parsing and observed downside sensitivity
        run: python3 -m unittest discover -s tests -p test_m5_pump_fee_and_risk_sensitivity.py -v
      - name: Test three-priority signed risk, quote parity and missing tick source request planning
        run: python3 -m unittest discover -s tests -p test_m5_parallel_three_priorities.py -v
      - name: Test empirical two-leg parity portfolio and conservative cost accounting
        run: python3 -m unittest discover -s tests -p test_signed_quote_parity_portfolio.py -v
      - name: Test contextual CLMM and Whirlpool tick array coverage diagnostics
        run: python3 -m unittest discover -s tests -p test_fixture_tick_coverage.py -v
      - name: Test observed signed two-leg quote deviation diagnostic without accuracy self-certification
        run: python3 -m unittest discover -s tests -p test_signed_quote_accuracy_report.py -v
      - name: Test captured Orca and CLMM initialized tick array extraction
        run: python3 -m unittest discover -s tests -p test_fixture_concentrated_ticks.py -v
      - name: Test signed intermediate SPL consumption against quoted second-leg input
        run: python3 -m unittest discover -s tests -p test_signed_intermediate_quote_parity.py -v
      - name: Test contextual hydrated fork account byte equality
        run: python3 -m unittest discover -s tests -p test_hydrated_fork_state_audit.py -v
      - name: Verify signed fixture receipt identity and prevent manufactured execution slot claims
        run: python3 -m unittest discover -s tests -p test_signed_fixture_provenance_gate.py -v
      - name: Test end-to-end AMM v4 fixture fee and adjusted-reserve quote adapter
        run: python3 -m unittest discover -s tests -p test_raydium_amm_v4_fixture_quote.py -v
      - name: Test source-derived AMM v4 trade fee and adjusted-reserve integration
        run: python3 -m unittest discover -s tests -p test_raydium_amm_v4_fee_state.py -v
      - name: Test source-captured AMM v4 OpenOrders market balances and adjusted reserves
        run: python3 -m unittest discover -s tests -p test_raydium_amm_v4_open_orders_reserves.py -v
      - name: Test account-derived CPMM and CLMM quote projections and safety gates
        run: python3 -m unittest discover -s tests -p test_fixture_config_quote_projection.py -v
      - name: Test actual manifest-captured CPMM and CLMM configuration fee decoding
        run: python3 -m unittest discover -s tests -p test_fixture_aux_fee_decoder.py -v
      - name: Test seven-venue auxiliary pricing requirements and no unsupported verification promotion
        run: python3 -m unittest discover -s tests -p test_seven_venue_aux_pricing_requirements.py -v
      - name: Test native pool fee derivation and conservative missing auxiliary-account gates
        run: python3 -m unittest discover -s tests -p test_fixture_native_quote_state.py -v
      - name: Verify all seven venue pool vaults, native liquidity and price fields from captured SPL accounts
        run: python3 -m unittest discover -s tests -p test_fixture_pool_fundamentals.py -v
      - name: Prevent injected pricing-state providers from self-certifying measured accuracy
        run: python3 -m unittest discover -s tests -p test_m5_accuracy_provenance_gate.py -v
      - name: Test seven-venue source fixture decoding and signed quote comparison orchestration
        run: python3 -m unittest discover -s tests -p test_fixture_quote_execution_pipeline.py -v
      - name: Test quote-to-source-fixture identity and exact slot/manifest matching
        run: python3 -m unittest discover -s tests -p test_fixture_quote_binding.py -v
      - name: Verify contextual source-state account checksum integrity
        run: python3 -m unittest discover -s tests -p test_source_snapshot_manifest.py -v
      - name: Verify signed receipt provenance extension never self-certifies quote accuracy
        run: python3 -m unittest discover -s tests -p test_m5_receipt_provenance.py -v
      - name: Test quote accuracy against independently signed atomic receipts and source identity
        run: python3 -m unittest discover -s tests -p test_quote_simulation_reconciliation.py -v
      - name: Test seven venue indicative quote adapters and missing-state safety gates
        run: python3 -m unittest discover -s tests -p test_remaining_venue_quote_provider.py -v
      - name: Test reproducible offline research JSON evidence and conservative provenance
        run: python3 -m unittest discover -s tests -p test_offline_research_report.py -v
      - name: Test bounded exact-input multi-size research sweeps without profit promotion
        run: python3 -m unittest discover -s tests -p test_research_trade_size_sweep.py -v
      - name: Test authenticated pool-to-quote-to-graph research integration
        run: python3 -m unittest discover -s tests -p test_snapshot_research_runner.py -v
      - name: Test authenticated PumpSwap directional reserve and fee quote adapter
        run: python3 -m unittest discover -s tests -p test_authenticated_pumpswap_quote_provider.py -v
      - name: Test authenticated Orca Whirlpool bounded in-tick quote adapter
        run: python3 -m unittest discover -s tests -p test_authenticated_orca_quote_provider.py -v
      - name: Test authenticated Raydium CLMM within-tick quote adapter
        run: python3 -m unittest discover -s tests -p test_authenticated_clmm_quote_provider.py -v
      - name: Test authenticated Raydium CPMM amount-aware quote adapter
        run: python3 -m unittest discover -s tests -p test_authenticated_quote_provider.py -v
      - name: Test isolated authenticated market-state registry and common quote evidence boundary
        run: python3 -m unittest discover -s tests -p test_market_state_and_quote_contract.py -v
      - name: Test agreed discovery-to-verification research engine orchestration
        run: python3 -m unittest discover -s tests -p test_research_engine_pipeline.py -v
      - name: Test M5 conservative observed quote route integration
        run: python3 -m unittest discover -s tests -p test_opportunity_quote_pipeline.py -v
      - name: Test M5 fail-closed quote and common-mint cost research boundaries
        run: python3 -m unittest discover -s tests -p test_opportunity_research.py -v
      - name: Check focused evidence cannot misrepresent historic coverage
        run: python3 -m unittest discover -s tests -p test_focused_amm_v4_evidence.py -v
      - name: Check AMM v4 accounts, ownership and market roles
        run: |
          python3 -m unittest discover -s tests -p test_amm_v4_open_orders_market_owner.py -v
          python3 -m unittest discover -s tests -p test_amm_v4_market_roles.py -v
          python3 -m unittest discover -s tests -p test_raydium_v4_market_preflight.py -v
      - name: Verify oversized CLMM and AMM v4 packets report exact size and v0 prerequisite
        run: python3 -m unittest discover -s tests -p test_atomic_packet_diagnostics.py -v
      - name: Test shared transaction packing independent of venue name
        run: python3 -m unittest discover -s tests -p test_shared_atomic_packet_selection.py -v
      - name: Test local-only v0 lookup table safety boundaries
        run: python3 -m unittest discover -s tests -p test_atomic_v0_lookup.py -v
      - name: Check focused source export and execution scripts parse
        run: python3 -m compileall -q arb/
  authenticate-amm-v4:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/solana-rpc-amm-v4-only
    steps:
      - uses: actions/checkout@v4
      - name: Require upstream RPC secret
        run: test -n "$SURFPOOL_DATASOURCE_RPC_URL"
      - name: Install Surfpool and solders
        run: |
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Launch read-only upstream-backed Surfpool
        run: |
          nohup surfpool start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/source-fork.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/source-fork.pid"
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else: raise SystemExit("read-only RPC unavailable")
          PY
      - name: Discover only new AMM v4 pool candidates
        run: |
          python3 -m arb.atomic_missing_venue_candidates --registry arb/pool_registry.json --output "$RUNNER_TEMP/venues.json"
      - name: Authenticate only AMM v4 ordered pool-pair candidates
        run: |
          python3 -m arb.next_ten_fork_pool_probe --batch remaining --only-venue raydium_amm_v4 --registry "$RUNNER_TEMP/venues.json" --output "$RUNNER_TEMP/amm-v4-ready.json"
      - name: Export twelve authenticated AMM v4 fixtures only
        run: |
          python3 -m arb.next_ten_pair_fixture_export --batch remaining --only-venue raydium_amm_v4 --readiness "$RUNNER_TEMP/amm-v4-ready.json" --output-dir "$RUNNER_TEMP/amm-v4-fixtures"
      - name: Publish authentic source diagnostics and isolated fixture bundle
        uses: actions/upload-artifact@v4
        with:
          name: amm-v4-focused-source
          path: |
            ${{ runner.temp }}/amm-v4-fixtures/
            ${{ runner.temp }}/amm-v4-ready.json
            ${{ runner.temp }}/venues.json
          if-no-files-found: error
      - name: Shut down upstream-backed fork before offline account writes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/source-fork.pid" ]; then kill "$(cat "$RUNNER_TEMP/source-fork.pid")" || true; fi
  offline-amm-v4:
    needs: [authenticate-amm-v4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1]
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_EXPLICITLY_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Surfpool offline runtime
        run: |
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
      - uses: actions/download-artifact@v4
        with:
          name: amm-v4-focused-source
          path: ${{ runner.temp }}
      - name: Start disposable explicitly offline Surfpool
        run: |
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/offline.log" 2>&1 < /dev/null &
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:time.sleep(2)
          else:raise SystemExit("offline RPC unavailable")
          PY
      - name: Execute only target AMM v4 routes with signed positive and rollback checks
        run: |
          python3 -m arb.next_ten_signed_atomic_offline --batch remaining --only-venue raydium_amm_v4 --shard-count 2 --shard-index ${{ matrix.shard }} --fixture-dir "$RUNNER_TEMP/amm-v4-fixtures" --output-dir "$RUNNER_TEMP/amm-v4-receipts"
      - name: Run all twelve AMM-v4 adaptive signed amount-continuity trials
        run: |
          python3 -m arb.next_ten_signed_atomic_offline --batch remaining --only-venue raydium_amm_v4 --adaptive-all-venues --shard-count 2 --shard-index ${{ matrix.shard }} --fixture-dir "$RUNNER_TEMP/amm-v4-fixtures" --output-dir "$RUNNER_TEMP/amm-v4-all-adaptive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-all-venue-adaptive-receipts-${{ matrix.shard }}
          path: ${{ runner.temp }}/amm-v4-all-adaptive/
          if-no-files-found: warn
      - name: Run separate adaptive CPMM-v4 signed amount-continuity research
        if: ${{ matrix.shard == 0 }}
        run: |
          python3 -m arb.next_ten_signed_atomic_offline --batch remaining --only-cpmm-v4 --adaptive-cpmm-v4 --fixture-dir "$RUNNER_TEMP/amm-v4-fixtures" --output-dir "$RUNNER_TEMP/amm-v4-adaptive"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.shard == 0 }}
        with:
          name: m5-adaptive-cpmm-v4-receipts
          path: ${{ runner.temp }}/amm-v4-adaptive/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amm-v4-signed-receipts-${{ matrix.shard }}
          path: ${{ runner.temp }}/amm-v4-receipts/
          if-no-files-found: error
  independent-amm-v4-audit:
    needs: [authenticate-amm-v4,offline-amm-v4]
    if: ${{ always() && needs.authenticate-amm-v4.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install captured on-chain account pricing dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - uses: actions/download-artifact@v4
        with:
          pattern: amm-v4-signed-receipts-*
          path: ${{ runner.temp }}/shards
      - name: Merge independent receipt shards
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          for shard in 0 1; do cp -a "$RUNNER_TEMP/shards/amm-v4-signed-receipts-$shard/." "$RUNNER_TEMP/receipts/"; done
      - uses: actions/download-artifact@v4
        with:
          pattern: m5-all-venue-adaptive-receipts-*
          path: ${{ runner.temp }}/adaptive-shards
      - name: Merge twelve all-venue adaptive receipt shards
        run: |
          mkdir -p "$RUNNER_TEMP/all-adaptive-receipts"
          for shard in 0 1; do cp -a "$RUNNER_TEMP/adaptive-shards/m5-all-venue-adaptive-receipts-$shard/." "$RUNNER_TEMP/all-adaptive-receipts/"; done
      - name: Enforce all-venue adaptive research gate for twelve focused routes
        run: |
          python3 -m arb.m5_all_venue_adaptive_acceptance --batch remaining --only-venue raydium_amm_v4 --receipts "$RUNNER_TEMP/all-adaptive-receipts" --output "$RUNNER_TEMP/m5-all-adaptive.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-all-venue-adaptive-acceptance
          path: ${{ runner.temp }}/m5-all-adaptive.json
          if-no-files-found: warn
      - name: Download adaptive CPMM-v4 signed research receipts
        uses: actions/download-artifact@v4
        with:
          name: m5-adaptive-cpmm-v4-receipts
          path: ${{ runner.temp }}/adaptive-receipts
      - name: Independently enforce both adaptive signed amount-continuity and rollback routes
        run: |
          python3 -m arb.m5_adaptive_signed_acceptance --receipts "$RUNNER_TEMP/adaptive-receipts" --output "$RUNNER_TEMP/m5-adaptive-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-adaptive-signed-acceptance
          path: ${{ runner.temp }}/m5-adaptive-acceptance.json
          if-no-files-found: warn
      - name: Download authenticated focused source fixture bundle for quote research
        uses: actions/download-artifact@v4
        with:
          name: amm-v4-focused-source
          path: ${{ runner.temp }}/source
      - name: Assess CPMM and AMM v4 actual source fixture and signed receipt diagnostic pairs
        run: |
          python3 -m arb.m5_focused_signed_experiment_batch \
            --fixture-dir "$RUNNER_TEMP/source/amm-v4-fixtures" \
            --receipt-dir "$RUNNER_TEMP/receipts" \
            --observed-unix "$(date +%s)" \
            --output "$RUNNER_TEMP/m5-cpmm-v4-experiments.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-cpmm-v4-source-quote-diagnostics
          path: ${{ runner.temp }}/m5-cpmm-v4-experiments.json
          if-no-files-found: warn
      - name: Independent acceptance; keep prior 30 strictly labeled historical
        run: python3 -m arb.focused_amm_v4_evidence --receipts "$RUNNER_TEMP/receipts" --output "$RUNNER_TEMP/amm-v4-audit.json"
      - name: Enforce all twelve signed atomic and rollback acceptances
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"amm-v4-audit.json").read_text())
          missing=[row["first_venue"]+"__"+row["second_venue"]
                   for row in result["routes"] if row["status"]!="VERIFIED"]
          assert result["current_run_target"]==12
          assert result["current_run_verified"]==12, "AMM v4 pairs regressed: "+str(missing)
          assert result["fresh_full_42_verified"] is False
          assert result["broadcast"] is False
          print("Fresh AMM v4 signed atomic and rollback regression: 12/12")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-twelve-atomic-acceptance
          path: ${{ runner.temp }}/amm-v4-audit.json
          if-no-files-found: error
