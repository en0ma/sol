          test -s "$RUNNER_TEMP/raydium-cpmm-source.json" || { echo "::error::Raydium CPMM source capture missing"; exit 1; }
          python3 -m arb.raydium_swap --source-file "$RUNNER_TEMP/raydium-cpmm-source.json" --output "$RUNNER_TEMP/m5-four-to-six-signed-attempt/raydium-cpmm-native-signed.json" --required-verified-pools 6
          test -s "$RUNNER_TEMP/m5-four-to-six-signed-attempt/raydium-cpmm-native-signed.json" || { echo "::error::Raydium signed receipt missing"; exit 1; }
      - name: Admit only signed native-priced pools into the usable venue registry
