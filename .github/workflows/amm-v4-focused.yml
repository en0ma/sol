              --output "$RUNNER_TEMP/m5-four-to-six-signed-attempt/orca-official-core-vs-python-vs-signed.json"
          fi
          if [ -s "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" ]; then
            python3 -m arb.m5_orca_signed_single_swap \
              --fixture "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" \
              --binary tools/orca_core_quote/target/release/sol-orca-native-reference \
              --output "$RUNNER_TEMP/m5-four-to-six-signed-attempt/orca-signed-bidirectional-three-way.json"
          fi
          if [ -s "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" ]; then
            python3 -m arb.m5_orca_fork_parity \
              --fixture "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" \
              --receipts "$RUNNER_TEMP/m5-four-to-six-signed-attempt" \
              --observed-unix "$(date +%s)" \
              --output "$RUNNER_TEMP/m5-four-to-six-signed-attempt/orca-three-size-fork-native-parity.json"
          fi
          if [ -s "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" ]; then
            python3 -m arb.m5_meteora_damm_v2_signed_native_parity \
              --binary tools/meteora_damm_v2_reference/target/release/sol-meteora-damm-v2-official-reference \
              --fixture "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" \
              --receipts "$RUNNER_TEMP/m5-four-to-six-signed-attempt" \
              --output "$RUNNER_TEMP/m5-four-to-six-signed-attempt/meteora-damm-v2-source-signed-parity.json"
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"m5-four-to-six-signed-attempt/four-to-six-venue.json"
          result=json.loads(p.read_text())
          print(json.dumps({"four_to_six_signed_status":result["status"],
