            --binary tools/meteora_damm_v2_reference/target/release/sol-meteora-damm-v2-official-reference \
            --output "$RUNNER_TEMP/m5-four-to-six-signed-attempt/meteora-damm-v2-dedicated-signed-fork.json"
      - name: Check six NEW Meteora pools against official Rust SDK and signed Surfpool
        if: ${{ matrix.shard == 0 }}
        run: |
          python3 -m arb.m5_meteora_damm_v2_dedicated_signed_fork \
            --pool-count 8 --required-verified-pools 6 \
            --source-file "$RUNNER_TEMP/meteora-six-new-upstream-source.json" \
            --binary tools/meteora_damm_v2_reference/target/release/sol-meteora-damm-v2-official-reference \
