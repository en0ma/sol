          path: ${{ runner.temp }}/amm-v4-three-hop/
          if-no-files-found: warn
      - name: Run separate adaptive CPMM-v4 signed amount-continuity research
        if: ${{ matrix.shard == 0 }}
        run: |
          python3 -m arb.next_ten_signed_atomic_offline --batch remaining --only-cpmm-v4 --adaptive-cpmm-v4 --fixture-dir "$RUNNER_TEMP/amm-v4-fixtures" --output-dir "$RUNNER_TEMP/amm-v4-adaptive"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.shard == 0 }}
        with:
          name: m5-adaptive-cpmm-v4-receipts
          path: ${{ runner.temp }}/amm-v4-adaptive/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amm-v4-signed-receipts-${{ matrix.shard }}
          path: ${{ runner.temp }}/amm-v4-receipts/
          if-no-files-found: error
  independent-amm-v4-audit:
    needs: [authenticate-amm-v4,offline-amm-v4]
    if: ${{ always() && needs.authenticate-amm-v4.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install captured on-chain account pricing dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - uses: actions/download-artifact@v4
        with:
          pattern: amm-v4-signed-receipts-*
          path: ${{ runner.temp }}/shards
      - name: Merge independent receipt shards
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          for shard in 0 1; do cp -a "$RUNNER_TEMP/shards/amm-v4-signed-receipts-$shard/." "$RUNNER_TEMP/receipts/"; done
      - uses: actions/download-artifact@v4
        with:
          pattern: m5-all-venue-adaptive-receipts-*
          path: ${{ runner.temp }}/adaptive-shards
      - name: Merge twelve all-venue adaptive receipt shards
        run: |
          mkdir -p "$RUNNER_TEMP/all-adaptive-receipts"
          for shard in 0 1; do cp -a "$RUNNER_TEMP/adaptive-shards/m5-all-venue-adaptive-receipts-$shard/." "$RUNNER_TEMP/all-adaptive-receipts/"; done
      - name: Enforce all-venue adaptive research gate for twelve focused routes
        run: |
          python3 -m arb.m5_all_venue_adaptive_acceptance --batch remaining --only-venue raydium_amm_v4 --receipts "$RUNNER_TEMP/all-adaptive-receipts" --output "$RUNNER_TEMP/m5-all-adaptive.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-all-venue-adaptive-acceptance
          path: ${{ runner.temp }}/m5-all-adaptive.json
          if-no-files-found: warn
      - uses: actions/download-artifact@v4
        with:
          name: m5-four-to-six-hop-signed-trial-receipts
          path: ${{ runner.temp }}/n-hop
      - name: Enforce six genuine signed four-to-six-hop execution and rollback trials
        run: |
          python3 -m arb.m5_n_hop_signed_acceptance --receipts "$RUNNER_TEMP/n-hop" --output "$RUNNER_TEMP/m5-n-hop-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-n-hop-independent-acceptance
          path: ${{ runner.temp }}/m5-n-hop-acceptance.json
          if-no-files-found: warn
      - uses: actions/download-artifact@v4
        with:
          name: m5-three-hop-actual-signed-receipts
          path: ${{ runner.temp }}/three-hop
      - name: Independently enforce both real signed three-hop execution and rollback routes
        run: |
          python3 -m arb.m5_three_hop_signed_acceptance --receipts "$RUNNER_TEMP/three-hop" --output "$RUNNER_TEMP/m5-three-hop-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-three-hop-independent-acceptance
          path: ${{ runner.temp }}/m5-three-hop-acceptance.json
          if-no-files-found: warn
      - name: Download adaptive CPMM-v4 signed research receipts
        uses: actions/download-artifact@v4
        with:
          name: m5-adaptive-cpmm-v4-receipts
          path: ${{ runner.temp }}/adaptive-receipts
      - name: Independently enforce both adaptive signed amount-continuity and rollback routes
        run: |
          python3 -m arb.m5_adaptive_signed_acceptance --receipts "$RUNNER_TEMP/adaptive-receipts" --output "$RUNNER_TEMP/m5-adaptive-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-adaptive-signed-acceptance
          path: ${{ runner.temp }}/m5-adaptive-acceptance.json
          if-no-files-found: warn
      - name: Download authenticated focused source fixture bundle for quote research
        uses: actions/download-artifact@v4
        with:
          name: amm-v4-focused-source
          path: ${{ runner.temp }}/source
      - name: Assess CPMM and AMM v4 actual source fixture and signed receipt diagnostic pairs
        run: |
          python3 -m arb.m5_focused_signed_experiment_batch \
            --fixture-dir "$RUNNER_TEMP/source/amm-v4-fixtures" \
            --receipt-dir "$RUNNER_TEMP/receipts" \
            --observed-unix "$(date +%s)" \
            --output "$RUNNER_TEMP/m5-cpmm-v4-experiments.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-cpmm-v4-source-quote-diagnostics
          path: ${{ runner.temp }}/m5-cpmm-v4-experiments.json
          if-no-files-found: warn
      - name: Independent acceptance; keep prior 30 strictly labeled historical
        run: python3 -m arb.focused_amm_v4_evidence --receipts "$RUNNER_TEMP/receipts" --output "$RUNNER_TEMP/amm-v4-audit.json"
      - name: Enforce all twelve signed atomic and rollback acceptances
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"amm-v4-audit.json").read_text())
          missing=[row["first_venue"]+"__"+row["second_venue"]
                   for row in result["routes"] if row["status"]!="VERIFIED"]
          assert result["current_run_target"]==12
          assert result["current_run_verified"]==12, "AMM v4 pairs regressed: "+str(missing)
          assert result["fresh_full_42_verified"] is False
          assert result["broadcast"] is False
          print("Fresh AMM v4 signed atomic and rollback regression: 12/12")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-twelve-atomic-acceptance
          path: ${{ runner.temp }}/amm-v4-audit.json
          if-no-files-found: error

  persist-verified-pool-registry:
    needs: [authenticate-amm-v4, offline-amm-v4, independent-amm-v4-audit]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.authenticate-amm-v4.result == 'success' && needs.offline-amm-v4.result == 'success' && needs.independent-amm-v4-audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: three-venue-signed-verified-pool-registry
          path: ${{ runner.temp }}/verified-registry
      - name: Persist only signed-verified pool identities in tracked registry
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          src=Path(os.environ["RUNNER_TEMP"])/"verified-registry/signed-verified-expanded-pool-registry.json"
          target=Path("arb/pool_registry.json")
          verified=json.loads(src.read_text())
          current=json.loads(target.read_text())
          if not isinstance(verified.get("pools"),list) or not isinstance(current.get("pools"),list):
              raise SystemExit("missing verified registry inventory")
          seen={(p["venue"],p["address"]) for p in current["pools"]}
          promoted=0
          for pool in verified["pools"]:
              key=(pool["venue"],pool["address"])
              if key not in seen:
                  current["pools"].append(pool)
                  seen.add(key)
                  promoted+=1
          target.write_text(json.dumps(current,indent=2)+"\n")
          print(json.dumps({"promoted_to_tracked_registry":promoted,"tracked_pool_count":len(current["pools"])}))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arb/pool_registry.json
          if git diff --cached --quiet; then
            echo "No new signed-verified pools to persist"
          else
            git commit -m "Persist signed-verified native venue pool identities"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
