          python3 -m py_compile arb/m5_source_multihop_interval_engine.py arb/next_ten_signed_atomic_offline.py
          python3 -m unittest discover -s tests -p test_m5_source_multihop_interval_engine.py -v
          echo "::endgroup::"
          echo "::group::Verify genuine multi-venue source quote sweeps remain nonbroadcast and unverified"
          python3 -m py_compile arb/m5_four_to_six_native_amount_sweep.py
          python3 -m unittest discover -s tests -p test_m5_four_to_six_native_amount_sweep.py -v
          echo "::endgroup::"
          echo "::group::Verify source-native DLMM bin fee-envelope implementation with adversarial fixtures"
          python3 -m py_compile arb/meteora_dlmm_source_fee_envelope.py
          python3 -m unittest discover -s tests -p test_meteora_dlmm_source_fee_envelope.py -v
          echo "::endgroup::"
          echo "::group::Verify actual DLMM pool static and volatility fee parsing with explicit dynamic fee limits"
          python3 -m py_compile arb/meteora_dlmm_source_fee_decoder.py
          python3 -m unittest discover -s tests -p test_meteora_dlmm_source_fee_decoder.py -v
          echo "::endgroup::"
          echo "::group::Validate source-decoded canonical DLMM bin inventories without promoting missing fee evidence"
          python3 -m py_compile arb/meteora_dlmm_source_bin_decoder.py
          python3 -m unittest discover -s tests -p test_meteora_dlmm_source_bin_decoder.py -v
          echo "::endgroup::"
          echo "::group::Verify authentic DAMM v2 source pool fee scheduler and dynamic fields"
          python3 -m py_compile arb/meteora_damm_v2_source_fee_decoder.py
          python3 -m unittest discover -s tests -p test_m5_damm_native_source_fee.py -v
          echo "::endgroup::"
          echo "::group::Verify billion-denominator DAMM fees and true PumpSwap source tier selection"
          python3 -m py_compile arb/meteora_damm_v2_native_quote.py arb/pumpswap_source_tier_selector.py
          python3 -m unittest discover -s tests -p test_m5_protocol_fee_math_native.py -v
          echo "::endgroup::"
          echo "::group::Verify multihop native-versus-signed SPL prefix parity fail-closed"
          python3 -m py_compile arb/m5_source_signed_prefix_quote_parity.py
          python3 -m unittest discover -s tests -p test_m5_source_signed_prefix_quote_parity.py -v
          echo "::endgroup::"
          echo "::group::Validate integrated PumpSwap DAMM v2 source price scenarios and nonbroadcast fee bounds"
          python3 -m py_compile arb/pumpswap_source_fee_envelope.py arb/meteora_damm_v2_source_scenarios.py arb/fixture_all_venue_signed_quotes.py
          python3 -m unittest discover -s tests -p test_m5_complex_venue_pricing_integration.py -v
          echo "::endgroup::"
          echo "::group::Verify three independent M5 milestone integrations"
          python3 -m py_compile arb/m5_four_to_six_source_capture.py arb/m5_source_indicative_route_chain.py arb/m5_four_to_six_signed_handoff.py
          python3 -m unittest discover -s tests -p test_m5_three_milestone_integration.py -v
          echo "::endgroup::"
          echo "::group::Verify captured source triangle invokes actual native quote adapters without false full-route pricing"
          python3 -m py_compile arb/m5_source_fixture_native_chain_diagnostic.py
          python3 -m unittest discover -s tests -p test_m5_source_fixture_native_chain_diagnostic.py -v
          echo "::endgroup::"
          echo "::group::Validate real-source multihop quote attempts fail closed on missing native pricing"
          python3 -m py_compile arb/m5_native_route_quote_attempts.py
          python3 -m unittest discover -s tests -p test_m5_native_route_quote_attempts.py -v
          echo "::endgroup::"
          echo "::group::Verify authenticated 2–6-hop native quote chain refuses incomplete source evidence"
          python3 -m py_compile arb/m5_authenticated_native_route_chain.py
          python3 -m unittest discover -s tests -p test_m5_authenticated_native_route_chain.py -v
          echo "::endgroup::"
          echo "::group::Validate native adapters for DLMM DAMM v2 and PumpSwap require authenticated auxiliary state"
          python3 -m py_compile arb/m5_complex_venue_native_quote.py arb/fixture_all_venue_signed_quotes.py
          python3 -m unittest discover -s tests -p test_m5_complex_venue_native_quote.py -v
          echo "::endgroup::"
      - name: Fast safety regression batch 9 (16 existing checks)
        run: |
          set -e
          echo "::group::Test genuine source-cycle venue-diverse shortlist"
          python3 -m unittest discover -s tests -p test_m5_authenticated_multihop_shortlist.py -v
          echo "::endgroup::"
          echo "::group::Test bounded public seven-venue pool discovery and source trust boundary"
          python3 -m py_compile arb/m5_seven_venue_public_hints.py
          python3 -m unittest discover -s tests -p test_m5_seven_venue_public_hints.py -v
          echo "::endgroup::"
          echo "::group::Test native source-bound multi-venue gross opportunity ranking"
          python3 -m py_compile arb/m5_source_triangle_quote_ranking.py arb/m5_seven_venue_route_scan.py
          python3 -m unittest discover -s tests -p test_m5_source_triangle_quote_ranking.py -v
          echo "::endgroup::"
          echo "::group::Test bounded multi-size native source candidate sweep"
          python3 -m py_compile arb/m5_source_trade_size_sweep.py
          python3 -m unittest discover -s tests -p test_m5_source_trade_size_sweep.py -v
          echo "::endgroup::"
          echo "::group::Test source-native quote ranking joined to real signed acceptance artifacts"
          python3 -m py_compile arb/m5_existing_source_research.py
          python3 -m unittest discover -s tests -p test_m5_existing_source_research.py -v
          echo "::endgroup::"
          echo "::group::Test M5 seven-venue discovery through source export and isolated signed Surfpool batch"
          python3 -m py_compile arb/m5_seven_venue_route_scan.py arb/m5_distinct_venue_coverage_batch.py
          python3 -m unittest discover -s tests -p test_m5_seven_venue_route_scan.py -v
          python3 -m unittest discover -s tests -p test_m5_research_full_fork_flow.py -v
          echo "::endgroup::"
          echo "::group::Test genuine source-registry six-hop native quote and cost-screen orchestration"
          python3 -m py_compile arb/opportunity_graph.py arb/opportunity_research.py arb/opportunity_quote_pipeline.py arb/research_engine_pipeline.py
          python3 -m unittest discover -s tests -p test_research_engine_pipeline.py -v
          echo "::endgroup::"
          echo "::group::Test agreed discovery-to-verification research engine orchestration"
          python3 -m unittest discover -s tests -p test_research_engine_pipeline.py -v
          echo "::endgroup::"
          echo "::group::Test M5 conservative observed quote route integration"
          python3 -m unittest discover -s tests -p test_opportunity_quote_pipeline.py -v
          echo "::endgroup::"
          echo "::group::Test M5 fail-closed quote and common-mint cost research boundaries"
          python3 -m unittest discover -s tests -p test_opportunity_research.py -v
          echo "::endgroup::"
          echo "::group::Check focused evidence cannot misrepresent historic coverage"
          python3 -m unittest discover -s tests -p test_focused_amm_v4_evidence.py -v
          echo "::endgroup::"
          echo "::group::Check AMM v4 accounts, ownership and market roles"
          python3 -m unittest discover -s tests -p test_amm_v4_open_orders_market_owner.py -v
          python3 -m unittest discover -s tests -p test_amm_v4_market_roles.py -v
          python3 -m unittest discover -s tests -p test_raydium_v4_market_preflight.py -v
          echo "::endgroup::"
          echo "::group::Verify oversized CLMM and AMM v4 packets report exact size and v0 prerequisite"
          python3 -m unittest discover -s tests -p test_atomic_packet_diagnostics.py -v
          echo "::endgroup::"
          echo "::group::Test shared transaction packing independent of venue name"
          python3 -m unittest discover -s tests -p test_shared_atomic_packet_selection.py -v
          echo "::endgroup::"
          echo "::group::Test local-only v0 lookup table safety boundaries"
          python3 -m unittest discover -s tests -p test_atomic_v0_lookup.py -v
          echo "::endgroup::"
          echo "::group::Check focused source export and execution scripts parse"
          python3 -m compileall -q arb/
          echo "::endgroup::"
  authenticate-amm-v4:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/solana-rpc-amm-v4-only
    steps:
      - uses: actions/checkout@v4
      - name: Require upstream RPC secret
        run: test -n "$SURFPOOL_DATASOURCE_RPC_URL"
      - name: Install Surfpool and solders
        run: |
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Launch read-only upstream-backed Surfpool
        run: |
          nohup surfpool start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/source-fork.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/source-fork.pid"
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else: raise SystemExit("read-only RPC unavailable")
          PY
      - name: Discover only new AMM v4 pool candidates
        run: |
          python3 -m arb.atomic_missing_venue_candidates --registry arb/pool_registry.json --output "$RUNNER_TEMP/venues.json"
      - name: Authenticate only AMM v4 ordered pool-pair candidates
        run: |
          python3 -m arb.next_ten_fork_pool_probe --batch remaining --only-venue raydium_amm_v4 --registry "$RUNNER_TEMP/venues.json" --output "$RUNNER_TEMP/amm-v4-ready.json"
      - name: Capture first authenticated closed three-distinct-venue source candidate
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"amm-v4-ready.json").read_text())
          candidates=report.get("authenticated_distinct_venue_three_leg_candidates",[])
          print(json.dumps({"authenticated_closed_three_venue_candidates":len(candidates),
                            "signed_execution_verified":False,"broadcast":False}))
          (Path(os.environ["RUNNER_TEMP"])/"three-venue-candidate-count.txt").write_text(str(len(candidates)))
          PY
          test "$(cat "$RUNNER_TEMP/three-venue-candidate-count.txt")" -gt 0
          python3 -m arb.next_ten_pair_fixture_export --readiness "$RUNNER_TEMP/amm-v4-ready.json" --triangle-index 0 --triangle-output "$RUNNER_TEMP/three-venue-source.json"
      - name: Export diverse distinct-venue source triangle fixture batch
        run: |
          python3 -m arb.m5_distinct_venue_coverage_batch --mode source --readiness "$RUNNER_TEMP/amm-v4-ready.json" --output-dir "$RUNNER_TEMP/three-venue-source-batch" --maximum 10
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"three-venue-source-batch"
          r=json.loads((root/"summary.json").read_text())
          decoded=r.get("native_auxiliary_diagnostics_captured",0)
          missing={}
          for row in r["routes"]:
              for reason in row.get("native_auxiliary_missing",[]):
                  missing[reason]=missing.get(reason,0)+1
              if row.get("native_auxiliary_status")=="AUXILIARY_DIAGNOSTICS_CAPTURED":
                  p=root/("source-native-aux-%02d.json"%row["index"])
                  evidence=json.loads(p.read_text())
                  assert evidence["full_native_fee_pricing_verified"] is False
                  assert evidence["broadcast"] is False
          print(json.dumps({"source_fixture_exports":r["exported"],
              "source_auxiliary_decoded":decoded,
              "source_auxiliary_missing_reason_counts":missing,
              "native_quotes_proven":False,"broadcast":False},sort_keys=True))
          PY
      - name: Produce actual multi-size native quote opportunity discovery evidence
        run: |
          python3 -m arb.m5_source_trade_size_sweep \
            --source-dir "$RUNNER_TEMP/three-venue-source-batch" \
            --sizes 10000,100000,1000000 \
            --observed-unix "$(date +%s)" \
            --output "$RUNNER_TEMP/m5-multi-size-source-opportunity-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-multi-size-source-opportunity-evidence
          path: ${{ runner.temp }}/m5-multi-size-source-opportunity-evidence.json
          if-no-files-found: warn
      - name: Export twelve authenticated AMM v4 fixtures only
        run: |
          python3 -m arb.next_ten_pair_fixture_export --batch remaining --only-venue raydium_amm_v4 --readiness "$RUNNER_TEMP/amm-v4-ready.json" --output-dir "$RUNNER_TEMP/amm-v4-fixtures"
      - name: Publish authentic source diagnostics and isolated fixture bundle
        uses: actions/upload-artifact@v4
        with:
          name: amm-v4-focused-source
          path: |
            ${{ runner.temp }}/amm-v4-fixtures/
            ${{ runner.temp }}/amm-v4-ready.json
            ${{ runner.temp }}/three-venue-source.json
            ${{ runner.temp }}/three-venue-source-batch/
            ${{ runner.temp }}/three-venue-candidate-count.txt
            ${{ runner.temp }}/venues.json
          if-no-files-found: error
      - name: Enumerate broad untrusted all-seven market pool hints and independently probe source-backed cycles
        continue-on-error: true
        run: |
          python3 -m arb.m5_seven_venue_public_hints \
            --registry arb/pool_registry.json \
            --max-per-venue 12 \
            --output "$RUNNER_TEMP/m5-seven-venue-untrusted-pool-hints.json"
          python3 -m arb.m5_seven_venue_route_scan \
            --registry "$RUNNER_TEMP/m5-seven-venue-untrusted-pool-hints.json" \
            --max-cycles 200 \
            --output "$RUNNER_TEMP/m5-broad-source-route-candidates.json"
          python3 -m arb.m5_four_to_six_source_capture \
            --graph "$RUNNER_TEMP/m5-broad-source-route-candidates.json" \
            --output "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" \
            --report "$RUNNER_TEMP/m5-four-to-six-source-capture.json"
          if [ -s "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" ]; then
            python3 -m arb.m5_source_indicative_route_chain \
              --fixture "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" \
              --amount 100000 --observed-unix "$(date +%s)" \
              --output "$RUNNER_TEMP/m5-four-to-six-native-chain.json"
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          from arb.m5_four_to_six_signed_handoff import assess
          root=Path(os.environ["RUNNER_TEMP"])
          fixture=json.loads((root/"m5-four-to-six-source-fixture.json").read_text())
          native=json.loads((root/"m5-four-to-six-native-chain.json").read_text())
          report=assess(fixture,quote_report=native)
          (root/"m5-four-to-six-signed-handoff.json").write_text(
              json.dumps(report,indent=2)+"\n")
          print(json.dumps({"four_to_six_signed_handoff":report["status"],
              "blockers":report["blockers"],"broadcast":False}))
          PY
          fi
      - name: Capture authentic Meteora pool, vaults and program ELF from upstream-backed fork
        run: |
          python3 -m arb.m5_meteora_damm_v2_dedicated_signed_fork \
            --capture-source \
            --registry "$RUNNER_TEMP/m5-seven-venue-untrusted-pool-hints.json" \
            --source-file "$RUNNER_TEMP/meteora-damm-v2-upstream-source.json" \
            --binary tools/meteora_damm_v2_reference/target/release/sol-meteora-damm-v2-official-reference \
            --output "$RUNNER_TEMP/meteora-damm-v2-capture-status.json"
      - name: Discover six new pools per venue with existing venue discovery and registry authentication
        run: |
          python3 -m arb.m5_venue_pool_registry_expansion \
            --registry arb/pool_registry.json \
            --count 20 --pages 8 \
            --output-registry "$RUNNER_TEMP/expanded-venue-pool-registry.json" \
            --output-new-pools "$RUNNER_TEMP/venue-six-new-pools.json" \
            --report "$RUNNER_TEMP/venue-pool-registry-expansion.json"
      - name: Capture six NEW verified Meteora pools with existing signed-fork source capture
        run: |
          python3 -m arb.m5_meteora_damm_v2_dedicated_signed_fork \
            --capture-source --pool-count 8 \
            --registry "$RUNNER_TEMP/venue-six-new-pools.json" \
            --source-file "$RUNNER_TEMP/meteora-six-new-upstream-source.json" \
            --binary tools/meteora_damm_v2_reference/target/release/sol-meteora-damm-v2-official-reference \
            --output "$RUNNER_TEMP/meteora-six-new-capture.json"
      - name: Capture new Orca source pool fixtures
        run: |
          python3 -m arb.m5_orca_signed_single_swap --capture-new-pools --pool-count 6 --registry "$RUNNER_TEMP/venue-six-new-pools.json" --new-pools-source "$RUNNER_TEMP/orca-new-pools-upstream-source.json" --binary tools/orca_core_quote/target/release/sol-orca-native-reference --output "$RUNNER_TEMP/orca-new-pools-capture.json"
      - name: Discover Raydium CPMM third-venue pool candidates with venue-native eligibility
        run: |
          python3 -m arb.m5_venue_pool_registry_expansion --venues raydium_cpmm --count 8 --pages 5 --output-registry "$RUNNER_TEMP/raydium-cpmm-candidate-registry.json" --output-new-pools "$RUNNER_TEMP/raydium-cpmm-candidates.json" --report "$RUNNER_TEMP/raydium-cpmm-discovery.json"
          python3 -m arb.raydium_swap --capture-source --registry "$RUNNER_TEMP/raydium-cpmm-candidates.json" --source-file "$RUNNER_TEMP/raydium-cpmm-source.json" --output "$RUNNER_TEMP/raydium-cpmm-capture.json" --pool-count 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-broad-seven-venue-discovery-and-source-cycles
          path: |
            ${{ runner.temp }}/m5-seven-venue-untrusted-pool-hints.json
            ${{ runner.temp }}/meteora-damm-v2-upstream-source.json
            ${{ runner.temp }}/expanded-venue-pool-registry.json
            ${{ runner.temp }}/venue-six-new-pools.json
            ${{ runner.temp }}/orca-new-pools-upstream-source.json
            ${{ runner.temp }}/raydium-cpmm-source.json
            ${{ runner.temp }}/raydium-cpmm-candidates.json
            ${{ runner.temp }}/raydium-cpmm-discovery.json
            ${{ runner.temp }}/meteora-six-new-upstream-source.json
            ${{ runner.temp }}/venue-pool-registry-expansion.json
            ${{ runner.temp }}/m5-broad-source-route-candidates.json
            ${{ runner.temp }}/m5-four-to-six-source-fixture.json
            ${{ runner.temp }}/m5-four-to-six-source-capture.json
            ${{ runner.temp }}/m5-four-to-six-native-chain.json
            ${{ runner.temp }}/m5-four-to-six-signed-handoff.json
          if-no-files-found: warn
      - name: Validate authenticated source graph connectivity and disclose short-route dominance
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"m5-broad-source-route-candidates.json"
          if not p.exists():
              print(json.dumps({"graph_diagnostic":"NOT_AVAILABLE","broadcast":False}))
          else:
              r=json.loads(p.read_text())
              t=r["authenticated_token_graph_topology"]
              print(json.dumps({"authenticated_pools":t["authenticated_pools"],
                  "distinct_token_mints":t["distinct_token_mints"],
                  "two_core_mints":t["two_core_mints"],
                  "connected_components":t["connected_components"],
                  "cycles_by_hops":r["cycle_coverage_by_hops"],
                  "all_cycle_counts_exhaustive":r["cycle_count_is_exhaustive"],
                  "broadcast":False}))
          PY
      - name: Prioritize source-authenticated four-to-six-hop venue-diverse research leads
        run: |
          if [ ! -s "$RUNNER_TEMP/m5-broad-source-route-candidates.json" ]; then
            echo "Broad source graph unavailable: no shortlist is claimed"
            python3 -c 'import json,os,pathlib;pathlib.Path(os.environ["RUNNER_TEMP"],"m5-authenticated-multihop-shortlist.json").write_text(json.dumps({"status":"SOURCE_GRAPH_UNAVAILABLE","selected":[],"total_source_cycles":0,"native_quoted_count":0,"net_profitable_count":0,"actionable":False,"live_execution_approved":False,"broadcast":False},indent=2)+"\\n")'
            exit 0
          fi
          python3 -m arb.m5_authenticated_multihop_shortlist \
            --graph "$RUNNER_TEMP/m5-broad-source-route-candidates.json" \
            --maximum 30 --output "$RUNNER_TEMP/m5-authenticated-multihop-shortlist.json"
      - name: Report source-bound multihop native adapter coverage explicitly
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"m5-authenticated-multihop-shortlist.json"
          if p.is_file():
              r=json.loads(p.read_text())
              print(json.dumps({k:r.get(k) for k in (
                  "status","total_source_cycles","native_adapter_covered_source_cycles",
                  "native_adapter_covered_selected","missing_auxiliary_venue_occurrences",
                  "native_quoted_count","net_profitable_count")},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-authenticated-multihop-shortlist
          path: ${{ runner.temp }}/m5-authenticated-multihop-shortlist.json
          if-no-files-found: warn
      - name: Shut down upstream-backed fork before offline account writes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/source-fork.pid" ]; then kill "$(cat "$RUNNER_TEMP/source-fork.pid")" || true; fi
  offline-amm-v4:
    needs: [authenticate-amm-v4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1]
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_EXPLICITLY_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Surfpool offline runtime
        run: |
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
      - uses: actions/download-artifact@v4
        with:
          name: amm-v4-focused-source
          path: ${{ runner.temp }}
      - name: Import independently captured four-to-six-hop source fixture for actual offline signing
        if: ${{ matrix.shard == 0 }}
        uses: actions/download-artifact@v4
        with:
          name: m5-broad-seven-venue-discovery-and-source-cycles
          path: ${{ runner.temp }}
      - name: Verify authenticated four-hop handoff exists before offline fork signing
        if: ${{ matrix.shard == 0 }}
        run: |
          test -s "$RUNNER_TEMP/m5-four-to-six-source-fixture.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from arb.source_snapshot_manifest import verify
          root=Path(os.environ["RUNNER_TEMP"])
          fixture=json.loads((root/"m5-four-to-six-source-fixture.json").read_text())
          verify(fixture)
          assert fixture["fixture_kind"]=="AUTHENTICATED_FOUR_TO_SIX_HOP_SOURCE_ROUTE"
          assert 4<=len(fixture["route_venues"])<=6
          assert all(fixture[k] is False for k in
                     ("actionable","live_execution_approved","broadcast"))
          print(json.dumps({"signed_handoff_fixture_hops":len(fixture["route_venues"]),
            "source_slot":fixture["state_accounts_observed_slot"],
            "accounts":fixture["state_account_count"],"broadcast":False}))
          PY
      - name: Start disposable explicitly offline Surfpool
        run: |
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/offline.log" 2>&1 < /dev/null &
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:time.sleep(2)
          else:raise SystemExit("offline RPC unavailable")
          PY
      - name: Reuse Rust venue reference compilation across CI runs
        if: ${{ matrix.shard == 0 }}
        uses: actions/cache@v4
        with:
          path: |
            tools/meteora_damm_v2_reference/target
