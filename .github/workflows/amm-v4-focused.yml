          python3 -m arb.m5_three_venue_signed_quote_parity "$RUNNER_TEMP/three-venue-source.json" "$RUNNER_TEMP/three-venue-trial/three-venue.json" "$(date +%s)" "$RUNNER_TEMP/three-venue-trial/three-venue-quote-parity.json"
      - uses: actions/upload-artifact@v4
