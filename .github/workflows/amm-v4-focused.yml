          if [ -s "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" ]; then
            python3 -m arb.next_ten_signed_atomic_offline \
              --four-to-six-venue-fixture "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" \
              --output-dir "$RUNNER_TEMP/m5-four-to-six-signed-attempt"
          else
            printf '%s\n' '{"status":"NO_AUTHENTICATED_FOUR_TO_SIX_HOP_SOURCE_FIXTURE","signed_atomic_simulation_verified":false,"actionable":false,"broadcast":false,"live_execution_approved":false}' > "$RUNNER_TEMP/m5-four-to-six-signed-attempt/four-to-six-venue.json"
          fi
          if [ -s "$RUNNER_TEMP/m5-four-to-six-source-fixture.json" ]; then
