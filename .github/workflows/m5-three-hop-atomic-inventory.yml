name: M5 Three Hop Atomic Build And Surfpool Simulation Inventory
on:
  pull_request:
    paths:
      - ".github/workflows/m5-three-hop-atomic-inventory.yml"
      - "arb/m5_three_hop_atomic_inventory.py"
      - "arb/m5_four_to_six_source_capture.py"
      - "arb/next_ten_signed_atomic_offline.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m5-three-hop-inventory-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-to-offline:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/m5-three-hop-pacing
    steps:
      - uses: actions/checkout@v4
      - name: Install Surfpool
        run: |
          test -n "$SURFPOOL_DATASOURCE_RPC_URL"
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
          python3 -m py_compile arb/m5_three_hop_atomic_inventory.py arb/m5_four_to_six_source_capture.py arb/next_ten_signed_atomic_offline.py
      - name: Start upstream-backed read-only source fork
        run: |
          nohup "$HOME/.local/bin/surfpool" start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/triangle-source.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/triangle-source.pid"
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(80):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except (ValueError,RuntimeError,OSError,KeyError):
                  time.sleep(1)
          else:
              raise SystemExit("source fork unavailable")
          PY
      - name: Discover and capture all 20 bounded three-hop cycles
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from arb.next_ten_fork_pool_probe import probe
          from arb.m5_seven_venue_route_scan import ORDER,analyze
          registry=json.loads(Path("arb/pool_registry.json").read_text())
          graph=analyze(probe("http://127.0.0.1:8899",registry,
                        batch=tuple((a,b) for a in ORDER for b in ORDER if a!=b)),
                        max_cycles=100)
          root=Path(os.environ["RUNNER_TEMP"])/"triangles"
          root.mkdir(parents=True,exist_ok=True)
          (root/"graph.json").write_text(json.dumps(graph,indent=2)+"\n")
          print(json.dumps({"three_hop_discovered":sum(r["hops"]==3 for r in graph["routes"]),
                            "three_hop_truncated":graph["cycle_coverage_by_hops"]["3"]["truncated"]}))
          PY
          python3 -m arb.m5_three_hop_atomic_inventory --phase source --graph "$RUNNER_TEMP/triangles/graph.json" --directory "$RUNNER_TEMP/triangles"
      - name: Terminate source fork before offline account mutation
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/triangle-source.pid"; then kill "$(cat "$RUNNER_TEMP/triangle-source.pid")" || true; fi
          python3 - <<'PY'
          import socket,time
          for _ in range(60):
              s=socket.socket();s.settimeout(.2)
              dead=s.connect_ex(("127.0.0.1",8899))!=0
              s.close()
              if dead:break
              time.sleep(1)
          else:raise SystemExit("source fork still available; signing prohibited")
          PY
      - name: Start disconnected Surfpool
        run: |
          nohup "$HOME/.local/bin/surfpool" start --ci --offline --no-deploy > "$RUNNER_TEMP/triangle-offline.log" 2>&1 < /dev/null &
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(80):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except (ValueError,RuntimeError,OSError,KeyError):
                  time.sleep(1)
          else:raise SystemExit("offline fork unavailable")
          PY
      - name: Build, sign and simulate each authenticated three-hop route
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
          SURFPOOL_DATASOURCE_RPC_URL: ""
        run: |
          python3 -m arb.m5_three_hop_atomic_inventory --phase offline --directory "$RUNNER_TEMP/triangles" --amount 100000
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"triangles/three-hop-inventory.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Three-hop cycles: {r['cycle_count']}; actual signed builds: {r.get('build_confirmed',0)}; signed simulations + rollback: {r.get('simulations_verified',0)}. Every route recorded in artifact.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-three-hop-atomic-inventory
          path: |
            ${{ runner.temp }}/triangles/
            ${{ runner.temp }}/triangle-source.log
            ${{ runner.temp }}/triangle-offline.log
          if-no-files-found: warn
