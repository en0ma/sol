  authenticated-source-fork:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/solana-rpc-isolated-last-request
    steps:
      - uses: actions/checkout@v4
      - name: Require upstream RPC secret
        run: test -n "$SURFPOOL_DATASOURCE_RPC_URL"
      - name: Install Surfpool
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install transaction dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Launch read-only source fork
        run: |
          nohup surfpool start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/fork.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/fork.pid"
      - name: Wait for source fork RPC
        run: |
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899", "getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("source fork RPC unavailable")
          PY

      # The upstream-backed process is stopped BEFORE any surfnet_setAccount call.
      - name: Authenticate next ten atomic pool-pair candidates on upstream-backed read-only fork
        run: |
          python3 -m arb.next_ten_fork_pool_probe \
            --output "$RUNNER_TEMP/next-ten-authenticated-pool-pairs.json"
      - name: Publish authenticated next ten fork pool candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-ten-authenticated-readonly-fork-pools
          path: ${{ runner.temp }}/next-ten-authenticated-pool-pairs.json
          if-no-files-found: error
      - name: Export ten authenticated dual-program fixtures from read-only Surfpool
        run: |
          python3 -m arb.next_ten_pair_fixture_export \
            --readiness "$RUNNER_TEMP/next-ten-authenticated-pool-pairs.json" \
            --output-dir "$RUNNER_TEMP/next-ten-dual-program-fixtures"
      - name: Upload ten genuine source-fork dual-program fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-ten-dual-program-readonly-fixtures
          path: ${{ runner.temp }}/next-ten-dual-program-fixtures/
          if-no-files-found: error
      - name: Discover following ten authenticated pool pair candidates
        run: |
          python3 -m arb.next_ten_fork_pool_probe --batch next \
            --output "$RUNNER_TEMP/following-ten-pool-pairs.json"
      - name: Export following ten authenticated source fixtures
        run: |
          python3 -m arb.next_ten_pair_fixture_export --batch next \
            --readiness "$RUNNER_TEMP/following-ten-pool-pairs.json" \
            --output-dir "$RUNNER_TEMP/following-ten-fixtures"
      - name: Upload following ten source fork fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: following-ten-authenticated-dual-program-fixtures
          path: ${{ runner.temp }}/following-ten-fixtures/
          if-no-files-found: warn
      - name: Bound AMM v4 candidate discovery once for remaining routes
        run: |
          python3 -m arb.atomic_missing_venue_candidates \
            --registry arb/pool_registry.json \
            --output "$RUNNER_TEMP/missing-venue-candidates.json"
      - name: Upload untrusted Raydium candidate provenance for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-venue-untrusted-candidates
          path: ${{ runner.temp }}/missing-venue-candidates.json
          if-no-files-found: error
      - name: Discover remaining twenty-four authenticated ordered pool candidates
        run: |
          python3 -m arb.next_ten_fork_pool_probe --batch remaining \
            --registry "$RUNNER_TEMP/missing-venue-candidates.json" \
            --output "$RUNNER_TEMP/remaining-24-pool-pairs.json"
      - name: Export remaining twenty-four read-only source-fork fixtures
        run: |
          python3 -m arb.next_ten_pair_fixture_export --batch remaining \
            --readiness "$RUNNER_TEMP/remaining-24-pool-pairs.json" \
            --output-dir "$RUNNER_TEMP/remaining-24-fixtures"
      - name: Publish remaining twenty-four authenticated source fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-24-authenticated-source-fixtures
          path: ${{ runner.temp }}/remaining-24-fixtures/
          if-no-files-found: warn
      - name: Export authenticated DAMM and CPMM atomic route
        run: python3 -m arb.damm_cpmm_atomic_offline export "$RUNNER_TEMP/damm-cpmm-atomic-fixture.json"
      - name: Produce actionable per-venue blocker breakdown before expensive offline execution
        run: |
          python3 -m arb.atomic_source_blocker_report \
            --probes "$RUNNER_TEMP/next-ten-authenticated-pool-pairs.json" "$RUNNER_TEMP/following-ten-pool-pairs.json" "$RUNNER_TEMP/remaining-24-pool-pairs.json" \
            --summaries "$RUNNER_TEMP/next-ten-dual-program-fixtures/summary.json" "$RUNNER_TEMP/following-ten-fixtures/summary.json" "$RUNNER_TEMP/remaining-24-fixtures/summary.json" \
            --output "$RUNNER_TEMP/atomic-source-blockers.json"
      - name: Publish exact source blockers and priority diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forty-two-source-blocker-diagnostics
          path: ${{ runner.temp }}/atomic-source-blockers.json
          if-no-files-found: error
      - name: Publish one verified fixture bundle for offline-only workers
        uses: actions/upload-artifact@v4
        with:
          name: source-fork-offline-bundle
          path: |
            ${{ runner.temp }}/damm-cpmm-atomic-fixture.json
            ${{ runner.temp }}/next-ten-dual-program-fixtures/
            ${{ runner.temp }}/following-ten-fixtures/
            ${{ runner.temp }}/remaining-24-fixtures/
          if-no-files-found: warn
      - name: Stop upstream-backed source fork
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/fork.pid"; then kill "$(cat "$RUNNER_TEMP/fork.pid")" || true; fi

  source-evidence-audit:
    needs: [authenticated-source-fork]
    if: ${{ needs.authenticated-source-fork.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download authenticated source fixture bundle
        uses: actions/download-artifact@v4
        with:
          name: source-fork-offline-bundle
          path: ${{ runner.temp }}
      - name: Check offline route manifests and authenticated fixture structure
        env:
          SOURCE_FIXTURE_ROOT: ${{ runner.temp }}
          SOURCE_EVIDENCE_AUDIT_REPORT: ${{ runner.temp }}/source-evidence-audit.json
        run: python3 -m arb.source_evidence_audit
      - name: Publish source evidence audit without additional upstream reads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-source-evidence-audit
          path: ${{ runner.temp }}/source-evidence-audit.json
          if-no-files-found: error

  offline-atomic-route-batches:
    needs: [authenticated-source-fork]
    if: ${{ needs.authenticated-source-fork.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - batch: first
            fixture_dir: next-ten-dual-program-fixtures
            shard: 0
            shards: 1
          - batch: next
            fixture_dir: following-ten-fixtures
            shard: 0
            shards: 1
          - batch: remaining
            fixture_dir: remaining-24-fixtures
            shard: 0
            shards: 4
          - batch: remaining
            fixture_dir: remaining-24-fixtures
            shard: 1
            shards: 4
          - batch: remaining
            fixture_dir: remaining-24-fixtures
            shard: 2
            shards: 4
          - batch: remaining
            fixture_dir: remaining-24-fixtures
            shard: 3
            shards: 4
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_EXPLICITLY_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install offline Surfpool and signing dependencies
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Download source-authenticated fixtures without upstream RPC
        uses: actions/download-artifact@v4
        with:
          name: source-fork-offline-bundle
          path: ${{ runner.temp }}
      - name: Start isolated offline Surfpool
        run: |
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/offline.log" 2>&1 < /dev/null &
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception: time.sleep(2)
          else: raise SystemExit("isolated offline Surfpool unavailable")
          PY
      - name: Execute authenticated signed batch with rollback verification
        run: |
          python3 -m arb.next_ten_signed_atomic_offline --batch "${{ matrix.batch }}" --shard-index "${{ matrix.shard }}" --shard-count "${{ matrix.shards }}" \
            --fixture-dir "$RUNNER_TEMP/${{ matrix.fixture_dir }}" \
            --output-dir "$RUNNER_TEMP/signed-evidence"
      - name: Publish independently replayable signed batch receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-atomic-receipts-${{ matrix.batch }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/signed-evidence/
          if-no-files-found: error

  isolated-orca-execution:
    needs: [authenticated-source-fork, offline-atomic-route-batches]
    if: ${{ always() && needs.authenticated-source-fork.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
    steps:
      - uses: actions/checkout@v4
      - name: Install Surfpool
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install transaction dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Retrieve authenticated read-only source fixtures
        uses: actions/download-artifact@v4
        with:
          name: source-fork-offline-bundle
          path: ${{ runner.temp }}
      - name: Launch strictly offline Surfpool
        run: |
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/offline.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/orca-isolated-offline.pid"
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899","getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else: raise SystemExit("offline Surfpool unavailable")
          PY
      - name: Attempt signed DAMM to CPMM atomic swap and rollback on isolated fork
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: |
          if [ -s "$RUNNER_TEMP/damm-cpmm-atomic-fixture.json" ]; then
            python3 -m arb.damm_cpmm_atomic_offline offline "$RUNNER_TEMP/damm-cpmm-atomic-fixture.json" \
              --output "$RUNNER_TEMP/damm-cpmm-atomic-evidence.json"
          else
            printf '{"status":"SOURCE_FIXTURE_UNAVAILABLE","signed_atomic_simulation_verified":false,"rollback_failure_case_verified":false,"intermediate_intra_transaction_consumption_verified":false,"actionable":false,"live_execution_approved":false,"broadcast":false}\n' > "$RUNNER_TEMP/damm-cpmm-atomic-evidence.json"
          fi
      - name: Attempt signed reverse CPMM to DAMM atomic transaction
        continue-on-error: true
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: |
          python3 -m arb.damm_cpmm_atomic_offline offline-reverse \
            "$RUNNER_TEMP/damm-cpmm-atomic-fixture.json" \
            --output "$RUNNER_TEMP/cpmm-damm-reverse-evidence.json"
      - name: Upload reverse CPMM to DAMM isolated execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmm-damm-signed-atomic-reverse
          path: ${{ runner.temp }}/cpmm-damm-reverse-evidence.json
          if-no-files-found: error
      - name: Independently accept reverse signed Surfpool atomic evidence
        run: |
          python3 -m arb.cpmm_damm_reverse_evidence_audit \
            --input "$RUNNER_TEMP/cpmm-damm-reverse-evidence.json" \
            --output "$RUNNER_TEMP/cpmm-damm-reverse-acceptance.json"
      - name: Upload independently accepted reverse atomic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmm-damm-reverse-independent-acceptance
          path: ${{ runner.temp }}/cpmm-damm-reverse-acceptance.json
          if-no-files-found: error
      - name: Independently accept observed signed atomic Surfpool execution
        run: |
          python3 -m arb.damm_cpmm_atomic_evidence_audit \
            --input "$RUNNER_TEMP/damm-cpmm-atomic-evidence.json" \
            --output "$RUNNER_TEMP/damm-cpmm-acceptance.json"
      - name: Download three independent signed atomic runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: isolated-atomic-receipts-*
          path: ${{ runner.temp }}/receipt-shards
      - name: Collate disjoint per-batch signed receipts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/next-ten-signed-evidence" "$RUNNER_TEMP/following-ten-signed-evidence" "$RUNNER_TEMP/remaining-24-signed-evidence"
          cp -a "$RUNNER_TEMP/receipt-shards/isolated-atomic-receipts-first-0/." "$RUNNER_TEMP/next-ten-signed-evidence/"
          cp -a "$RUNNER_TEMP/receipt-shards/isolated-atomic-receipts-next-0/." "$RUNNER_TEMP/following-ten-signed-evidence/"
          for shard in 0 1 2 3; do
            cp -a "$RUNNER_TEMP/receipt-shards/isolated-atomic-receipts-remaining-$shard/." "$RUNNER_TEMP/remaining-24-signed-evidence/"
          done
      - name: Reconcile verified current-run atomic evidence into 42 ordered pairs
        run: |
          python3 -m arb.current_run_atomic_matrix \
            --input "$RUNNER_TEMP/damm-cpmm-atomic-evidence.json" \
            --reverse-input "$RUNNER_TEMP/cpmm-damm-reverse-evidence.json" \
            --next-ten-evidence-dir "$RUNNER_TEMP/next-ten-signed-evidence" \
            --following-ten-evidence-dir "$RUNNER_TEMP/following-ten-signed-evidence" \
            --remaining-evidence-dir "$RUNNER_TEMP/remaining-24-signed-evidence" \
            --output "$RUNNER_TEMP/current-run-atomic-matrix.json"
      - name: Publish next ten ordered route evidence gap report
        run: |
          python3 -m arb.next_ten_atomic_evidence \
            --evidence-dir "$RUNNER_TEMP/next-ten-signed-evidence" \
            --output "$RUNNER_TEMP/next-ten-ordered-evidence.json"
      - name: Independently audit following ten signed route receipts
        run: |
          python3 -m arb.next_ten_atomic_evidence --batch next \
            --evidence-dir "$RUNNER_TEMP/following-ten-signed-evidence" \
            --output "$RUNNER_TEMP/following-ten-evidence-audit.json"
      - name: Independently audit remaining twenty-four runtime receipts
        run: |
          python3 -m arb.next_ten_atomic_evidence --batch remaining \
            --evidence-dir "$RUNNER_TEMP/remaining-24-signed-evidence" \
            --output "$RUNNER_TEMP/remaining-24-audit.json"
      - name: Publish independently audited remaining twenty-four coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-24-ordered-atomic-audit
          path: ${{ runner.temp }}/remaining-24-audit.json
          if-no-files-found: error
      - name: Upload independently audited following ten coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: following-ten-ordered-signed-atomic-audit
          path: ${{ runner.temp }}/following-ten-evidence-audit.json
          if-no-files-found: error
      - name: Upload next ten ordered evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-ten-ordered-signed-atomic-audit
          path: ${{ runner.temp }}/next-ten-ordered-evidence.json
          if-no-files-found: error
      - name: Independently reconcile full 42 directed atomic evidence receipts
        run: |
          python3 -m arb.forty_two_atomic_evidence \
            --evidence-dirs "$RUNNER_TEMP/next-ten-signed-evidence" "$RUNNER_TEMP/following-ten-signed-evidence" "$RUNNER_TEMP/remaining-24-signed-evidence" \
            --output "$RUNNER_TEMP/forty-two-ordered-atomic-acceptance.json"
      - name: Enforce accepted first-five venue pair regression floor
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"forty-two-ordered-atomic-acceptance.json"
          report=json.loads(p.read_text())
          core={"orca","raydium_cpmm","meteora_dlmm","meteora_damm_v2","pumpswap"}
          covered={(row["first_venue"],row["second_venue"]) for row in report["routes"]
                   if row["status"]=="VERIFIED" and row["first_venue"] in core
                   and row["second_venue"] in core}
          print("Core venue signed atomic accepted:",len(covered),"/20")
          missing=[(x,y) for x in sorted(core) for y in sorted(core)
                   if x!=y and (x,y) not in covered]
          if missing:
              raise SystemExit("Previously verified core ordered pairs regressed: "+str(missing))
          assert report["ordered_pair_verified"]>=20
          PY
      - name: Upload independently accepted 42-pair coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-42-ordered-atomic-coverage-audit
          path: ${{ runner.temp }}/forty-two-ordered-atomic-acceptance.json
          if-no-files-found: error
      - name: Upload current-run ordered atomic acceptance matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-run-atomic-pair-matrix
          path: ${{ runner.temp }}/current-run-atomic-matrix.json
          if-no-files-found: error
      - name: Upload accepted ordered-pair execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damm-cpmm-independent-atomic-acceptance
          path: ${{ runner.temp }}/damm-cpmm-acceptance.json
          if-no-files-found: error
      - name: Upload DAMM to CPMM signed atomic and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damm-cpmm-signed-atomic-rollback
          path: ${{ runner.temp }}/damm-cpmm-atomic-evidence.json
          if-no-files-found: error

