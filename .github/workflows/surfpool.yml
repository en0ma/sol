  orca-three-hop-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_EXPLICITLY_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Wait for read-only fixture artifact without blocking on full fork job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orca-three-hop-export"
          for attempt in $(seq 1 90); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "orca-three-hop-readonly-fixture") | .id' | head -n 1) || true
            if [ -n "$id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/orca-fixture.zip"
              unzip -q "$RUNNER_TEMP/orca-fixture.zip" -d "$RUNNER_TEMP/orca-three-hop-export"
              exit 0
            fi
            sleep 10
          done
          echo "Read-only three-hop fixture not available in bounded interval" >&2
      - name: Install simulation dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Install Surfpool for disposable offline instance
        shell: bash
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Start explicitly offline validator and attempt atomic three-hop cycle
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/orca-three-hop-export/orca-three-hop-fixture.json"
          output="$RUNNER_TEMP/orca-three-hop-offline-report.json"
          if [ ! -s "$fixture" ]; then
            echo '{"status":"READ_ONLY_FIXTURE_MISSING","broadcast":false,"actionable":false}' > "$output"
            exit 0
          fi
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/orca-three-hop-offline.log" 2>&1 < /dev/null &
          for attempt in $(seq 1 60); do
            if curl --fail --silent -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' "$SOLANA_RPC_URL" | grep -q blockhash; then break; fi
            sleep 2
          done
          python3 -m arb.orca_three_hop_offline_simulation "$fixture" "$output"
          for extra in "$RUNNER_TEMP"/orca-three-hop-export/orca-three-hop-fixture-[0-9]*.json; do
            if [ -s "$extra" ]; then
              suffix="${extra##*-}"
              suffix="${suffix%.json}"
              python3 -m arb.orca_three_hop_offline_simulation "$extra" \
                "$RUNNER_TEMP/orca-three-hop-offline-report-$suffix.json"
            fi
          done
      - name: Upload offline signed three-hop simulation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-three-hop-isolated-offline-simulation
          path: |
