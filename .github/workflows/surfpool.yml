name: Surfpool CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surfpool-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Surfpool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location https://run.surfpool.run/ -o /tmp/install-surfpool.sh
          bash /tmp/install-surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start local Surfpool validator
        shell: bash
        run: |
          set -euo pipefail
          NO_DNA=1 surfpool --version
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/surfpool.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/surfpool.pid"

      - name: Wait for RPC and verify blockhash
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' \
              "$SOLANA_RPC_URL" > "$RUNNER_TEMP/rpc-response.json"; then
              if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["result"]["value"]["blockhash"]' "$RUNNER_TEMP/rpc-response.json"; then
                echo "Surfpool RPC ready at $SOLANA_RPC_URL"
                cat "$RUNNER_TEMP/rpc-response.json"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Surfpool did not become ready" >&2
          cat "$RUNNER_TEMP/surfpool.log" >&2
          exit 1

      - name: Enforce arbitrage mission and development priorities
        run: python3 -m arb.arbitrage_mission
      - name: Test honest venue-coverage capability accounting
        run: python3 -m unittest discover -s tests -p test_venue_coverage.py -v
      - name: Test missing-quote venue prioritization across discovered routes
        run: python3 -m unittest discover -s tests -p test_quote_gap_priorities.py -v
      - name: Test fail-closed multi-pool route quote screening
        run: python3 -m unittest discover -s tests -p test_cycle_screen.py -v
      - name: Test indicative Orca single-tick quote arithmetic
        run: python3 -m unittest discover -s tests -p test_orca_spot_quote.py -v
      - name: Test fee-aware CPMM candidate screening
        run: python3 -m unittest discover -s tests -p test_cpmm_screen.py -v
      - name: Test verified on-chain CPMM fee config decoding
        run: python3 -m unittest discover -s tests -p test_cpmm_config.py -v
      - name: Test integer CPMM amount-aware quote safety
        run: python3 -m unittest discover -s tests -p test_cpmm_quote.py -v
      - name: Test conservative residual-token valuation
        run: python3 -m unittest discover -s tests -p test_whirlpool_accounting.py -v
      - name: Test Raydium to Orca reverse route wiring
        run: python3 -m unittest discover -s tests -p test_reverse_sweep.py -v
      - name: Test jittered RPC rate-limit retries
        run: python3 -m unittest discover -s tests -p test_rpc_retries.py -v
      - name: Test on-chain transaction-history discovery
        run: python3 -m unittest discover -s tests -p test_onchain_history_discovery.py -v
      - name: Test incremental pool registry ingestion
        run: python3 -m unittest discover -s tests -p test_pool_registry_ingest.py -v
      - name: Test persistent pool registry safety checks
        run: python3 -m unittest discover -s tests -p test_pool_registry.py -v
      - name: Test Meteora DAMM v2 pool decoder and mint filters
        run: python3 -m unittest discover -s tests -p test_meteora_damm_v2.py -v
      - name: Test Meteora DLMM pool layout and mint filters
        run: python3 -m unittest discover -s tests -p test_meteora_dlmm.py -v
      - name: Test local-only lookup table guard
        run: python3 -m unittest discover -s tests -p test_clmm_local_alt.py -v
      - name: Test versioned transaction lookup-table safety
        run: python3 -m unittest discover -s tests -p test_clmm_v0.py -v
      - name: Test new recognized DEX program watchlist safety
        run: python3 -m unittest discover -s tests -p test_venue_watchlist.py -v
      - name: Test third-leg owner-aware discovery
        run: python3 -m unittest discover -s tests -p test_third_leg_owner.py -v
      - name: Test fail-closed RAY-to-WSOL third-leg readiness
        run: python3 -m unittest discover -s tests -p test_third_leg_readiness.py -v
      - name: Test fine-grained exact-output sweep
        run: python3 -m unittest discover -s tests -p test_three_hop_fine_sweep.py -v
      - name: Test bounded three-hop output sweep and unknown-fee safety
        run: python3 -m unittest discover -s tests -p test_three_hop_sweep.py -v
      - name: Test Orca exact-output return leg serialization
        run: python3 -m unittest discover -s tests -p test_orca_exact_output_return.py -v
      - name: Test CLMM simulation post-balance assertions
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_execution.py -v
      - name: Test CLMM candidate fixture safety gates
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_candidates.py -v
      - name: Test CLMM fork readiness reporting
        run: python3 -m unittest discover -s tests -p test_clmm_pool_readiness.py -v
      - name: Test CLMM tick-array PDA start and packed account layout
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_ticks.py -v
      - name: Test Raydium CLMM swap v2 instruction serialization
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_swap.py -v
      - name: Test conservative Raydium CLMM within-tick amount quote
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_within_tick_quote.py -v
      - name: Test Raydium CLMM packed pool decoder
        run: python3 -m unittest discover -s tests -p test_raydium_clmm.py -v
      - name: Test Raydium CLMM discovery filters
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_filters.py -v
      - name: Test expanded DEX venue registry
        run: python3 -m unittest discover -s tests -p test_dex_registry.py -v
      - name: Test zero-prefixed pubkey decoding
        run: python3 -m unittest discover -s tests -p test_base58_pubkeys.py -v
      - name: Test multi-venue arbitrage graph and cycle discovery
        run: python3 -m unittest discover -s tests -p test_opportunity_graph.py -v
      - name: Test multi-token on-chain discovery filters
        run: python3 -m unittest discover -s tests -p test_onchain_pool_discovery.py -v
      - name: Test bounded route sweep and profit filter
        run: python3 -m unittest discover -s tests -p test_cross_venue_sweep.py -v
      - name: Test cross-venue safety gates
        run: python3 -m unittest discover -s tests -p test_cross_venue.py -v
      - name: Test Raydium CPMM swap instruction encoding
        run: python3 -m unittest discover -s tests -p test_raydium_swap.py -v
      - name: Test Raydium published-pool diagnostic
        run: python3 -m unittest discover -s tests -p test_raydium_candidate.py -v
      - name: Test Raydium CPMM on-chain decoder and restricted search
        run: python3 -m unittest discover -s tests -p test_raydium_cpmm.py -v
      - name: Test exact-output atomic swap instruction semantics
        run: python3 -m unittest discover -s tests -p test_whirlpool_exact_output.py -v
      - name: Test atomic Whirlpool round-trip accounting
        run: python3 -m unittest discover -s tests -p test_whirlpool_roundtrip.py -v
      - name: Test actual simulated token balance assertions
        run: python3 -m unittest discover -s tests -p test_simulated_balances.py -v
      - name: Test atomic Whirlpool simulation guardrails
        run: python3 -m unittest discover -s tests -p test_whirlpool_simulation.py -v
      - name: Test swap preflight safety gates
        run: python3 -m unittest discover -s tests -p test_whirlpool_preflight.py -v
      - name: Test Orca swap instruction payload
        run: python3 -m unittest discover -s tests -p test_whirlpool_swap.py -v
      - name: Run Whirlpool tick-array math tests
        run: python3 -m unittest discover -s tests -p test_whirlpool_ticks.py -v
      - name: Run serialized transaction replay contract tests
        run: python3 -m unittest arb.transaction_replay.ReplayTests -v
      - name: Run Whirlpool spot mathematics and market gate tests
        run: python3 -m unittest arb.whirlpool_market.MarketTests -v
      - name: Run arbitrage arithmetic tests
        env:
          RUN_SURFPOOL_INTEGRATION: '1'
        run: python3 -m unittest discover -s tests -v

      # Future: run atomic swap integration tests with forked program accounts.

      - name: Upload Surfpool log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-log
          path: ${{ runner.temp }}/surfpool.log
          if-no-files-found: ignore

  mainnet-fork-probe:
    # Secrets are unavailable to untrusted fork PRs; verify forks on trusted branches/PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check datasource is configured
        run: |
          if [ -z "$SURFPOOL_DATASOURCE_RPC_URL" ]; then
            echo "Configure repository secret SOLANA_MAINNET_RPC_URL to enable fork verification." >&2
            exit 1
          fi
      - name: Install Surfpool
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location https://run.surfpool.run/ -o /tmp/install-surfpool.sh
          bash /tmp/install-surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Start Surfpool mainnet fork
        run: |
          nohup surfpool start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/fork.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/fork.pid"
      - name: Wait for RPC
        run: |
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for i in range(60):
              try:
                  assert call("http://127.0.0.1:8899", "getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Surfpool fork RPC unavailable")
          PY
      - name: Install transaction serialization dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Simulate a signed local transaction
        run: python3 -m arb.simulate_transfer
      - name: Authenticate real PumpSwap fee/config accounts on Surfpool fork
        env:
          PUMPSWAP_PREFLIGHT_REPORT: ${{ runner.temp }}/pumpswap-preflight.json
        run: python3 -m arb.pumpswap_fork_preflight
      - name: Upload PumpSwap authenticated config evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpswap-fork-preflight
          path: ${{ runner.temp }}/pumpswap-preflight.json
          if-no-files-found: ignore
      - name: Probe deployed AMM programs and configured pools
        run: python3 -m arb.fork_probe
      - name: Report direct on-chain Whirlpool verification
        env:
          POOL_VERIFICATION_REPORT: ${{ runner.temp }}/whirlpool-report.json
        run: python3 -m arb.pool_report
      - name: Upload pool validation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whirlpool-verification-report
          path: ${{ runner.temp }}/whirlpool-report.json
          if-no-files-found: ignore
      - name: Analyze pinned Whirlpool spot state on fork
        env:
          WHIRLPOOL_MARKET_REPORT: ${{ runner.temp }}/whirlpool-market.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          with open("arb/whirlpool_pools.json") as f:
              pools=json.load(f)["pools"]
          if not pools:
              print("NOT_CONFIGURED: no verified pool; market-state scan unavailable")
          else:
              subprocess.run(["python3","-m","arb.whirlpool_market","--output",
                              os.environ["WHIRLPOOL_MARKET_REPORT"]],check=True)
          PY
      - name: Upload market-state report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whirlpool-market-state
          path: ${{ runner.temp }}/whirlpool-market.json
          if-no-files-found: ignore
      - name: Simulate captured AMM transactions when fixtures exist
        env:
          REPLAY_REPORT: ${{ runner.temp }}/replay-report.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          with open("arb/replay_cases.json") as f:
              manifest=json.load(f)
          if manifest.get("cases"):
              subprocess.run(["python3","-m","arb.transaction_replay","--output",
                              os.environ["REPLAY_REPORT"]],check=True)
          else:
              with open(os.environ["REPLAY_REPORT"],"w") as f:
                  json.dump({"status":"NOT_CONFIGURED","passed":False,"results":[]},f)
              print("NOT_CONFIGURED: captured AMM simulation fixtures unavailable")
          PY
      - name: Upload transaction replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-transaction-replay
          path: ${{ runner.temp }}/replay-report.json
          if-no-files-found: ignore
      - name: Inspect nearby on-chain tick arrays
        run: python3 -m arb.whirlpool_ticks
      - name: Check on-chain swap account readiness
        run: |
          python3 - <<'PY'
          import json,os
          from arb.whirlpool_swap import inspect_swap_requirements
          with open("arb/whirlpool_pools.json") as f: pools=json.load(f)["pools"]
          for p in pools:
              print(json.dumps(inspect_swap_requirements(os.environ["SOLANA_RPC_URL"],p["address"]),indent=2))
          PY
      - name: Simulate Orca swap preflight on Surfpool
        run: python3 -m arb.whirlpool_preflight
      - name: Simulate atomic WSOL to USDC Whirlpool swap
        run: python3 -m arb.whirlpool_simulation
      - name: Compare Orca exact-input quote model with signed Surfpool balances
        env:
          ORCA_QUOTE_COMPARISON_REPORT: ${{ runner.temp }}/orca-quote-comparison.json
        run: python3 -m arb.orca_quote_probe
      - name: Upload Orca quote comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-quote-comparison
          path: ${{ runner.temp }}/orca-quote-comparison.json
          if-no-files-found: ignore
      - name: Simulate atomic WSOL USDC WSOL round trip
        run: python3 -m arb.whirlpool_roundtrip
      - name: Check published Raydium CPMM pool against on-chain mints
        env:
          RAYDIUM_CANDIDATE_REPORT: ${{ runner.temp }}/raydium-candidate.json
        run: python3 -m arb.raydium_candidate
      - name: Upload Raydium candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raydium-candidate
          path: ${{ runner.temp }}/raydium-candidate.json
          if-no-files-found: ignore
      - name: Simulate real Raydium CPMM SOL to USDC swap
        run: python3 -m arb.raydium_swap
      - name: Simulate atomic Orca to Raydium two-venue route
        run: python3 -m arb.cross_venue
      - name: Sweep actual atomic cross-venue trade sizes
        env:
          CROSS_VENUE_SWEEP_REPORT: ${{ runner.temp }}/cross-venue-sweep.json
        run: python3 -m arb.cross_venue_sweep
      - name: Sweep reverse Raydium to Orca routes
        env:
          CROSS_VENUE_REVERSE: '1'
          CROSS_VENUE_SWEEP_REPORT: ${{ runner.temp }}/reverse-sweep.json
        run: python3 -m arb.cross_venue_sweep
      - name: Upload reverse sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reverse-cross-venue-sweep
          path: ${{ runner.temp }}/reverse-sweep.json
          if-no-files-found: ignore
      - name: Upload cross-venue sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-venue-size-sweep
          path: ${{ runner.temp }}/cross-venue-sweep.json
          if-no-files-found: ignore
      - name: Probe five on-chain DEX venue capability levels
        env:
          DEX_VENUE_REPORT: ${{ runner.temp }}/dex-venues.json
        run: python3 -m arb.dex_registry
      - name: Upload DEX venue capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onchain-dex-venue-registry
          path: ${{ runner.temp }}/dex-venues.json
          if-no-files-found: ignore
      - name: Verify prospective RAY-to-WSOL third leg via Solana RPC
        env:
          THIRD_LEG_REPORT: ${{ runner.temp }}/third-leg-readiness.json
        run: python3 -m arb.third_leg_readiness
      - name: Upload third-leg pool verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ray-wsol-third-leg-readiness
          path: ${{ runner.temp }}/third-leg-readiness.json
          if-no-files-found: ignore
      - name: Attempt closed three-venue cycle without broadcast
        env:
          THREE_HOP_REPORT: ${{ runner.temp }}/three-hop-cycle.json
        run: python3 -m arb.three_hop_cycle || test "$?" -eq 2
      - name: Upload closed-cycle simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-hop-cycle
          path: ${{ runner.temp }}/three-hop-cycle.json
          if-no-files-found: ignore
      - name: Attempt simulation-only CPMM to CLMM route with local funding
        env:
          CLMM_SWAP_REPORT: ${{ runner.temp }}/clmm-swap-attempt.json
        run: python3 -m arb.raydium_clmm_execution
      - name: Upload CLMM swap attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raydium-clmm-swap-attempt
          path: ${{ runner.temp }}/clmm-swap-attempt.json
          if-no-files-found: ignore
      - name: Check published CLMM pool candidate against live fork
        env:
          CLMM_CANDIDATE_REPORT: ${{ runner.temp }}/clmm-candidates.json
        run: python3 -m arb.raydium_clmm_candidates
      - name: Upload Raydium CLMM candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raydium-clmm-candidate
          path: ${{ runner.temp }}/clmm-candidates.json
          if-no-files-found: ignore
      - name: Report pinned CLMM tick-array readiness
        env:
          CLMM_PREFLIGHT_REPORT: ${{ runner.temp }}/clmm-readiness.json
        run: python3 -m arb.clmm_pool_readiness
      - name: Upload CLMM readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raydium-clmm-readiness
          path: ${{ runner.temp }}/clmm-readiness.json
          if-no-files-found: ignore
      - name: Scan additional RAY and stablecoin pools on five DEX programs
        env:
          DEX_DISCOVERY_REPORT: ${{ runner.temp }}/expanded-pool-discovery.json
        run: python3 -m arb.onchain_pool_discovery --pairs WSOL/RAY,USDC/RAY --limit 8 --pace-seconds 2 --registry-fallback arb/pool_registry.json || test "$?" -eq 2
      - name: Upload expanded five-venue pool discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-five-venue-pool-discovery
          path: ${{ runner.temp }}/expanded-pool-discovery.json
          if-no-files-found: ignore
      - name: Discover cyclic arbitrage routes from verified pool graph
        env:
          ARB_GRAPH_REPORT: ${{ runner.temp }}/arbitrage-graph.json
        run: python3 -m arb.opportunity_graph --extra-pairs ""
      - name: Upload candidate arbitrage route graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onchain-arbitrage-route-graph
          path: ${{ runner.temp }}/arbitrage-graph.json
          if-no-files-found: ignore
      - name: Screen full discovered arbitrage cycles across trade sizes
        env:
          CYCLE_SCREEN_REPORT: ${{ runner.temp }}/cycle-screen.json
          DEX_DISCOVERY_INPUT: ${{ runner.temp }}/expanded-pool-discovery.json
        run: python3 -m arb.cycle_screen
      - name: Upload quote coverage and cycle screening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-cycle-screen
          path: ${{ runner.temp }}/cycle-screen.json
          if-no-files-found: ignore
      - name: Screen Raydium CPMM liquidity across trade sizes
        env:
          CPMM_QUOTE_REPORT: ${{ runner.temp }}/cpmm-quote-screen.json
        run: python3 -m arb.cpmm_screen
      - name: Upload fee-aware CPMM size screening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpmm-size-screening
          path: ${{ runner.temp }}/cpmm-quote-screen.json
          if-no-files-found: ignore
      - name: Verify Raydium CPMM fee configuration on Surfpool
        env:
          CPMM_CONFIG_REPORT: ${{ runner.temp }}/cpmm-config.json
        run: python3 -m arb.cpmm_config
      - name: Upload CPMM on-chain fee evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onchain-cpmm-fee-config
          path: ${{ runner.temp }}/cpmm-config.json
          if-no-files-found: ignore
      - name: Report validated pool and executable venue coverage
        env:
          VENUE_COVERAGE_REPORT: ${{ runner.temp }}/venue-coverage.json
        run: python3 -m arb.venue_coverage
      - name: Upload arbitrage venue coverage scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-venue-coverage
          path: ${{ runner.temp }}/venue-coverage.json
          if-no-files-found: ignore
      - name: Refresh pinned multi-venue pool registry via targeted RPC
        env:
          POOL_REGISTRY_REPORT: ${{ runner.temp }}/pool-registry-refresh.json
        run: python3 -m arb.pool_registry
      - name: Upload verified pool registry snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-pool-registry
          path: ${{ runner.temp }}/pool-registry-refresh.json
          if-no-files-found: ignore
      - name: Discover additional on-chain SOL token pools
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEX_DISCOVERY_REPORT: ${{ runner.temp }}/dex-discovery.json
        run: |
          python3 -m arb.onchain_pool_discovery --pairs WSOL/RAY,USDC/RAY,WSOL/USDT,USDC/USDT --limit 8 || test "$?" -eq 2
      - name: Discover pool identities from bounded on-chain transaction history
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEX_HISTORY_REPORT: ${{ runner.temp }}/dex-history.json
        run: python3 -m arb.onchain_history_discovery --venues orca,raydium_cpmm --signatures 3 || test "$?" -eq 2
      - name: Upload on-chain transaction-history discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onchain-history-pool-discovery
          path: ${{ runner.temp }}/dex-history.json
          if-no-files-found: ignore
      - name: Revalidate discovery candidates into registry snapshot
        if: always()
        env:
          CANDIDATE_DISCOVERY: ${{ runner.temp }}/expanded-pool-discovery.json
          HISTORY_DISCOVERY: ${{ runner.temp }}/dex-history.json
        run: |
          inputs=()
          if [ -s "$CANDIDATE_DISCOVERY" ]; then inputs+=(--discovery "$CANDIDATE_DISCOVERY"); fi
          if [ -s "$HISTORY_DISCOVERY" ]; then inputs+=(--discovery "$HISTORY_DISCOVERY"); fi
          if [ "${#inputs[@]}" -gt 0 ]; then
            python3 -m arb.pool_registry_ingest "${inputs[@]}" --output "$RUNNER_TEMP/next-pool-registry.json" || test "$?" -eq 2
          fi
      - name: Upload incremental registry snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-pool-registry
          path: ${{ runner.temp }}/next-pool-registry.json
          if-no-files-found: ignore
      - name: Upload multi-token pool discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onchain-multi-token-discovery
          path: ${{ runner.temp }}/dex-discovery.json
          if-no-files-found: ignore
      - name: Report independently verified Raydium CPMM fixtures
        run: |
          python3 -m arb.raydium_cpmm || test "$?" -eq 2
      - name: Require verified pool fixture for swap-stage readiness
        env:
          POOL_VERIFICATION_REPORT: ${{ runner.temp }}/whirlpool-report.json
        run: python3 -m arb.pool_readiness
      - name: Test on-chain account discovery against Surfpool
        run: python3 -m unittest discover -s tests -p test_onchain_discovery.py -v
      - name: Upload fork logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-mainnet-fork-log
          path: ${{ runner.temp }}/fork.log
          if-no-files-found: ignore
