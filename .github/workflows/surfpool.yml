        run: |
          inputs=()
          if [ -s "$CANDIDATE_DISCOVERY" ]; then inputs+=(--discovery "$CANDIDATE_DISCOVERY"); fi
          if [ -s "$HISTORY_DISCOVERY" ]; then inputs+=(--discovery "$HISTORY_DISCOVERY"); fi
          if [ "${#inputs[@]}" -gt 0 ]; then
            python3 -m arb.pool_registry_ingest "${inputs[@]}" --output "$RUNNER_TEMP/next-pool-registry.json" || test "$?" -eq 2
          fi
      - name: Upload incremental registry snapshot
