name: Surfpool Full 42 Manual Regression

on:
  pull_request:
  workflow_dispatch:

# Avoid competing Surfpool forks against the same free-tier Alchemy account.
concurrency:
  group: surfpool-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci-runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Audit prior CI job durations and obsolete diagnostic candidates without RPC
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUNTIME_AUDIT_OUTPUT: ${{ runner.temp }}/ci-runtime-audit.json
        run: python3 -m arb.ci_job_runtime_audit
      - name: Publish retrospective CI performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-runtime-audit
          path: ${{ runner.temp }}/ci-runtime-audit.json
          if-no-files-found: warn
  pairwise-capability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install solders for real builder serialization tests
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Unit-test pairwise execution evidence
        run: python3 -m unittest discover -s tests -p test_atomic_pair_evidence_matrix.py -v
      - name: Test Raydium AMM v4 market owner authentication
        run: python3 -m unittest discover -s tests -p test_raydium_v4_market_preflight.py -v
      - name: Test public Raydium pool discovery and onchain authentication boundary
        run: python3 -m unittest discover -s tests -p test_raydium_public_pool_discovery.py -v
      - name: Test bounded legacy pool discovery
        run: python3 -m unittest discover -s tests -p test_legacy_pool_discovery.py -v
      - name: Test seven-venue evidence validation contract
        run: python3 -m unittest discover -s tests -p test_validate_eight_venue_probe.py -v
      - name: Test seven-venue onchain validation probe
        run: python3 -m unittest discover -s tests -p test_eight_venue_onchain_probe.py -v
      - name: Test DAMM v2 fresh onchain authentication before signing
        run: python3 -m unittest discover -s tests -p test_damm_v2_signed_preflight.py -v
      - name: Test authenticated DAMM v2 signed standalone simulation runner
        run: python3 -m unittest discover -s tests -p test_meteora_damm_v2_signed_runner.py -v
      - name: Test opt-in DAMM v2 real-fork signed execution harness
        run: python3 -m unittest discover -s tests -p test_damm_v2_fork_execution.py -v
      - name: Test DAMM v2 source export and isolated hydration safety
        run: python3 -m unittest discover -s tests -p test_damm_v2_isolated_execution.py -v
      - name: Test signed DAMM v2 evidence acceptance and negative controls
        run: python3 -m unittest discover -s tests -p test_damm_v2_execution_evidence_audit.py -v
      - name: Test DAMM to CPMM atomic fork integration safety
        run: python3 -m unittest discover -s tests -p test_damm_cpmm_atomic_offline.py -v
      - name: Test remaining 24-pair full signed integration and fail-closed matrix
        run: python3 -m unittest discover -s tests -p test_remaining_twenty_four_pipeline.py -v
      - name: Verify PumpSwap V2 exact-input 17-account builder and authenticated buyback gate
        run: python3 -m unittest discover -s tests -p test_pumpswap_trade_v2.py -v
      - name: Test offline source bundle structural audit and fail-closed accounting
        run: python3 -m unittest discover -s tests -p test_source_evidence_audit.py -v
      - name: Test bounded AMM v4 candidate mint intersection ranking
        run: python3 -m unittest discover -s tests -p test_amm_v4_matching_candidates.py -v
      - name: Test CLMM candidate discovery and matching mint preference
        run: python3 -m unittest discover -s tests -p test_clmm_candidate_coverage.py -v
      - name: Test bounded missing venue source candidate enrichment
