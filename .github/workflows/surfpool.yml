name: Surfpool CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surfpool-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Surfpool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location https://run.surfpool.run/ -o /tmp/install-surfpool.sh
          bash /tmp/install-surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start local Surfpool validator
        shell: bash
        run: |
          set -euo pipefail
          NO_DNA=1 surfpool --version
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/surfpool.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/surfpool.pid"

      - name: Wait for RPC and verify blockhash
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' \
              "$SOLANA_RPC_URL" > "$RUNNER_TEMP/rpc-response.json"; then
              if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["result"]["value"]["blockhash"]' "$RUNNER_TEMP/rpc-response.json"; then
                echo "Surfpool RPC ready at $SOLANA_RPC_URL"
                cat "$RUNNER_TEMP/rpc-response.json"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Surfpool did not become ready" >&2
          cat "$RUNNER_TEMP/surfpool.log" >&2
          exit 1

      - name: Run arbitrage arithmetic tests
        env:
          RUN_SURFPOOL_INTEGRATION: '1'
        run: python3 -m unittest discover -s tests -v

      # Future: run atomic swap integration tests with forked program accounts.

      - name: Upload Surfpool log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-log
          path: ${{ runner.temp }}/surfpool.log
          if-no-files-found: ignore

  mainnet-fork-probe:
    # Secrets are unavailable to untrusted fork PRs; verify forks on trusted branches/PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check datasource is configured
        run: |
          if [ -z "$SURFPOOL_DATASOURCE_RPC_URL" ]; then
            echo "Configure repository secret SOLANA_MAINNET_RPC_URL to enable fork verification." >&2
            exit 1
          fi
      - name: Install Surfpool
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location https://run.surfpool.run/ -o /tmp/install-surfpool.sh
          bash /tmp/install-surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Start Surfpool mainnet fork
        run: |
          nohup surfpool start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/fork.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/fork.pid"
      - name: Wait for RPC
        run: |
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for i in range(60):
              try:
                  assert call("http://127.0.0.1:8899", "getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Surfpool fork RPC unavailable")
          PY
      - name: Discover and validate Raydium SOL/USDC pools
        run: python3 -m arb.discover_raydium --output "$RUNNER_TEMP/discovered-pools.json"
      - name: Probe DEX program and pool accounts
        env:
          POOL_MANIFEST: ${{ runner.temp }}/discovered-pools.json
        run: python3 -m arb.fork_probe
      - name: Upload discovered pool manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-raydium-pools
          path: ${{ runner.temp }}/discovered-pools.json
          if-no-files-found: ignore
      - name: Upload fork logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-mainnet-fork-log
          path: ${{ runner.temp }}/fork.log
          if-no-files-found: ignore
