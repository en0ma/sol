        run: |
          python3 -m arb.raydium_cpmm || test "$?" -eq 2
      - name: Require verified pool fixture for swap-stage readiness
        env:
          POOL_VERIFICATION_REPORT: ${{ runner.temp }}/whirlpool-report.json
        run: python3 -m arb.pool_readiness
      - name: Test on-chain account discovery against Surfpool
        run: python3 -m unittest discover -s tests -p test_onchain_discovery.py -v
      - name: Report Surfpool upstream rate-limit evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"fork.log"
          raw=path.read_text(errors="replace") if path.exists() else ""
          report={"fork_log_present":path.exists(),
                  "upstream_429_log_lines":sum(bool(re.search(r"429|too many requests",line,re.I))
                                                for line in raw.splitlines()),
                  "python_rpc_interval_seconds":os.environ.get("SOLANA_RPC_MIN_INTERVAL_SECONDS"),
                  "internal_surfpool_upstream_throttling_verified":False}
          output=Path(os.environ["RUNNER_TEMP"])/"surfpool-rpc-rate-limit.json"
          output.write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload Surfpool rate-limit observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-rate-limit-observations
          path: ${{ runner.temp }}/surfpool-rpc-rate-limit.json
          if-no-files-found: ignore
      - name: Upload fork logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-mainnet-fork-log
          path: ${{ runner.temp }}/fork.log
          if-no-files-found: ignore

  isolated-orca-execution:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/solana-rpc-isolated-last-request
    steps:
      - uses: actions/checkout@v4
      - name: Require upstream RPC secret
        run: test -n "$SURFPOOL_DATASOURCE_RPC_URL"
      - name: Install Surfpool
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install transaction dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Launch read-only source fork
        run: |
          nohup surfpool start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/fork.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/fork.pid"
      - name: Wait for source fork RPC
        run: |
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899", "getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("source fork RPC unavailable")
          PY

      # The upstream-backed process is stopped BEFORE any surfnet_setAccount call.
      - name: Export authenticated Orca state from read-only fork
        run: python3 -m arb.orca_swap_v2_isolated_offline_execution export "$RUNNER_TEMP/orca-isolated-state.json"
      - name: Stop upstream-backed fork and start isolated offline Surfpool
        if: ${{ hashFiles('arb/orca_swap_v2_isolated_offline_execution.py') != '' }}
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/fork.pid")"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/fork.pid")" 2>/dev/null; then break; fi
            sleep 1
          done
          # A pending process MUST NOT receive synthetic account writes.
          if kill -0 "$(cat "$RUNNER_TEMP/fork.pid")" 2>/dev/null; then
            echo "Mainnet-backed Surfpool still alive; refusing offline provisioning" >&2
            exit 1
          fi
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/orca-isolated-offline.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/orca-isolated-offline.pid"
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for _ in range(60):
              try:
                  assert call("http://127.0.0.1:8899", "getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("isolated Surfpool RPC did not become ready")
          PY
      - name: Hydrate disposable offline Orca fixture and attempt signed SwapV2
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: |
          if [ -s "$RUNNER_TEMP/orca-isolated-state.json" ] && [ -s "$RUNNER_TEMP/orca-isolated-offline.pid" ]; then
            python3 -m arb.orca_swap_v2_isolated_offline_execution offline "$RUNNER_TEMP/orca-isolated-state.json" > "$RUNNER_TEMP/orca-isolated-attempt.json"
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"orca-isolated-attempt.json").read_text())
          assert report.get("status")=="OFFLINE_SIGNED_SWAP_RECONCILED", report.get("status")
          assert report.get("simulation_error") is None, report.get("simulation_error")
          assert report.get("signed_simulation_verified") is True
          assert report.get("broadcast") is False
          assert report.get("actionable") is False
          print("Signed offline SwapV2 token balance reconciliation verified")
          PY
          else
            echo '{"status":"ISOLATED_FIXTURE_NOT_READY","signed_simulation_verified":false,"broadcast":false}' > "$RUNNER_TEMP/orca-isolated-attempt.json"
            exit 1
          fi
      - name: Upload disposable offline Orca SwapV2 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-isolated-offline-swapv2
          path: |
            ${{ runner.temp }}/orca-isolated-attempt.json
            ${{ runner.temp }}/orca-isolated-offline.log
          if-no-files-found: ignore

  meteora-dlmm-standalone-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_EXPLICITLY_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Wait for authenticated DLMM fixture artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meteora-export"
          for attempt in $(seq 1 90); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "meteora-dlmm-readonly-offline-fixture") | .id' | head -n 1) || true
            if [ -n "$id" ]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/meteora-fixture.zip"
              unzip -q "$RUNNER_TEMP/meteora-fixture.zip" -d "$RUNNER_TEMP/meteora-export"
              exit 0
            fi
            sleep 10
          done
          echo "DLMM fixture unavailable" >&2
          exit 1
      - name: Install signed transaction dependencies
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Install Surfpool isolated offline runtime
        shell: bash
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Attempt signed standalone DLMM swap on offline Surfpool
        shell: bash
        run: |
          set -euo pipefail
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/meteora-dlmm-offline.log" 2>&1 < /dev/null &
          for attempt in $(seq 1 60); do
            if curl --fail --silent -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' "$SOLANA_RPC_URL" | grep -q blockhash; then break; fi
            sleep 2
          done
          python3 -m arb.meteora_dlmm_offline_simulation \
            "$RUNNER_TEMP/meteora-export/meteora-dlmm-fixture.json" \
            "$RUNNER_TEMP/meteora-dlmm-offline-report.json"
      - name: Upload isolated DLMM signed-simulation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteora-dlmm-isolated-offline-simulation
          path: |
            ${{ runner.temp }}/meteora-dlmm-offline-report.json
            ${{ runner.temp }}/meteora-dlmm-offline.log
          if-no-files-found: ignore

