      - name: Test reverse CPMM to DAMM signed atomic runner safety
        run: python3 -m unittest discover -s tests -p test_cpmm_damm_reverse_atomic.py -v
      - name: Test independent reverse atomic evidence acceptance safety
        run: python3 -m unittest discover -s tests -p test_cpmm_damm_reverse_evidence_audit.py -v
      - name: Test independent DAMM to CPMM signed evidence acceptance
        run: python3 -m unittest discover -s tests -p test_damm_cpmm_atomic_evidence_audit.py -v
      - name: Test current-run 42 ordered-pair evidence reconciliation
        run: python3 -m unittest discover -s tests -p test_current_run_atomic_matrix.py -v
      - name: Test cryptographically signed standalone swap post-state verifier
        run: python3 -m unittest discover -s tests -p test_signed_standalone_swap_verifier.py -v
      - name: Test signed atomic instruction order and intermediate account preflight
