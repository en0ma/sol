name: Surfpool CI

on:
  pull_request:
  workflow_dispatch:

# Avoid competing Surfpool forks against the same free-tier Alchemy account.
concurrency:
  group: surfpool-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  pairwise-capability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install solders for real builder serialization tests
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Unit-test pairwise execution evidence
        run: python3 -m unittest discover -s tests -p test_atomic_pair_evidence_matrix.py -v
      - name: Test Raydium AMM v4 market owner authentication
        run: python3 -m unittest discover -s tests -p test_raydium_v4_market_preflight.py -v
      - name: Test local-fork Orca legacy program ownership preflight
        run: python3 -m unittest discover -s tests -p test_orca_legacy_owner_preflight.py -v
      - name: Test token-agnostic Orca public DEX index adapter
        run: python3 -m unittest discover -s tests -p test_orca_legacy_public_index.py -v
      - name: Test untrusted Orca legacy pool candidate authentication
        run: python3 -m unittest discover -s tests -p test_orca_legacy_public_candidates.py -v
      - name: Test public Raydium pool discovery and onchain authentication boundary
        run: python3 -m unittest discover -s tests -p test_raydium_public_pool_discovery.py -v
      - name: Test bounded legacy pool discovery
        run: python3 -m unittest discover -s tests -p test_legacy_pool_discovery.py -v
      - name: Test eight-venue evidence validation contract
        run: python3 -m unittest discover -s tests -p test_validate_eight_venue_probe.py -v
      - name: Test eight-venue onchain validation probe
        run: python3 -m unittest discover -s tests -p test_eight_venue_onchain_probe.py -v
      - name: Test signed atomic instruction order and intermediate account preflight
        run: python3 -m unittest discover -s tests -p test_signed_atomic_instruction_preflight.py -v
      - name: Test local-only signed cross-venue atomic verifier
        run: python3 -m unittest discover -s tests -p test_cross_venue_atomic_simulation.py -v
      - name: Test PumpSwap signed local runner transaction and output-bound wiring
        run: python3 -m unittest discover -s tests -p test_pumpswap_signed_runner.py -v
      - name: Test PumpSwap signed simulation post-state and slippage floor
        run: python3 -m unittest discover -s tests -p test_pumpswap_local_simulation.py -v
      - name: Test PumpSwap v2 swap instruction encoding
        run: python3 -m unittest discover -s tests -p test_pumpswap_swap.py -v
      - name: Test Meteora DAMM v2 swap2 instruction encoding
        run: python3 -m unittest discover -s tests -p test_meteora_damm_v2_swap.py -v
      - name: Test legacy venue decoders and swap instruction encoding
        run: python3 -m unittest discover -s tests -p test_legacy_venue_adapters.py -v
      - name: Test complete eight-venue execution target
        run: python3 -m unittest discover -s tests -p test_execution_target_matrix.py -v
      - name: Generate 8-venue 56-order atomic execution gap report
        run: python3 -m arb.execution_target_matrix --output "$RUNNER_TEMP/execution-target-matrix.json"
      - name: Upload complete execution target matrix
        uses: actions/upload-artifact@v4
        with:
          name: eight-venue-execution-target-matrix
          path: ${{ runner.temp }}/execution-target-matrix.json
      - name: Test verified missing-pair route prioritization
        run: python3 -m unittest discover -s tests -p test_missing_pair_route_inventory.py -v
      - name: Generate all historical pairwise venue evidence
        run: python3 -m arb.venue_capabilities --output "$RUNNER_TEMP/atomic-venue-pair-matrix.json"
      - name: Upload independently generated pairwise evidence
        uses: actions/upload-artifact@v4
        with:
          name: independent-atomic-pairwise-matrix
          path: ${{ runner.temp }}/atomic-venue-pair-matrix.json
  surfpool-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Surfpool
        shell: bash
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start local Surfpool validator
        shell: bash
        run: |
          set -euo pipefail
          NO_DNA=1 surfpool --version
          nohup surfpool start --ci --offline > "$RUNNER_TEMP/surfpool.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/surfpool.pid"

      - name: Wait for RPC and verify blockhash
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}' \
              "$SOLANA_RPC_URL" > "$RUNNER_TEMP/rpc-response.json"; then
              if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["result"]["value"]["blockhash"]' "$RUNNER_TEMP/rpc-response.json"; then
                echo "Surfpool RPC ready at $SOLANA_RPC_URL"
                cat "$RUNNER_TEMP/rpc-response.json"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Surfpool did not become ready" >&2
          cat "$RUNNER_TEMP/surfpool.log" >&2
          exit 1

      - name: Install Python Solana PDA dependency for offline tests
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0

      - name: Test authenticated token-cycle venue canonicalization
        run: python3 -m unittest discover -s tests -p test_token_cycle_verify.py -v

      - name: Probe ephemeral signer token accounts on offline Surfpool (read-only)
        run: python3 -m arb.orca_swap_v2_offline_probe

      - name: Provision and verify ephemeral token accounts on offline Surfpool
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: python3 -m arb.orca_swap_v2_offline_provision

      - name: Exercise historical Token-2022 fixture synthetic account readback offline
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: python3 -m arb.orca_swap_v2_fixture_offline_integration

      - name: Probe signed Token-2022 runtime on explicitly offline Surfpool
        continue-on-error: true
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: python3 -m arb.orca_swap_v2_offline_token_runtime_probe > "$RUNNER_TEMP/orca-token-runtime.json"
      - name: Upload signed Token-2022 runtime diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-token-runtime
          path: ${{ runner.temp }}/orca-token-runtime.json
          if-no-files-found: ignore

      - name: Probe signed Token-2022 transfer with initialized synthetic mint offline
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: python3 -m arb.orca_swap_v2_offline_initialized_mint_probe > "$RUNNER_TEMP/orca-initialized-mint-runtime.json"
      - name: Upload initialized offline Token-2022 runtime diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-initialized-mint-runtime
          path: ${{ runner.temp }}/orca-initialized-mint-runtime.json
          if-no-files-found: ignore

      - name: Validate signed transaction simulation transport on offline Surfpool
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: python3 -m arb.orca_swap_v2_offline_signed_transport

      - name: Verify signed Orca SwapV2 rejects unverified pool on offline Surfpool
        env:
          SURFPOOL_EXPLICITLY_OFFLINE: "1"
        run: python3 -m arb.orca_swap_v2_offline_negative_control

      - name: Enforce arbitrage mission and development priorities
        run: python3 -m arb.arbitrage_mission
      - name: Generate historical pairwise atomic execution evidence matrix
        run: python3 -m arb.venue_capabilities --output "$RUNNER_TEMP/atomic-venue-pair-matrix.json"
      - name: Upload pairwise atomic evidence matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-venue-pair-evidence-matrix
          path: ${{ runner.temp }}/atomic-venue-pair-matrix.json
          if-no-files-found: ignore
      - name: Test honest venue-coverage capability accounting
        run: python3 -m unittest discover -s tests -p test_venue_coverage.py -v
      - name: Test missing-quote venue prioritization across discovered routes
        run: python3 -m unittest discover -s tests -p test_quote_gap_priorities.py -v
      - name: Test fail-closed multi-pool route quote screening
        run: python3 -m unittest discover -s tests -p test_cycle_screen.py -v
      - name: Test indicative Orca single-tick quote arithmetic
        run: python3 -m unittest discover -s tests -p test_orca_spot_quote.py -v
      - name: Test fee-aware CPMM candidate screening
        run: python3 -m unittest discover -s tests -p test_cpmm_screen.py -v
      - name: Test verified on-chain CPMM fee config decoding
        run: python3 -m unittest discover -s tests -p test_cpmm_config.py -v
      - name: Test integer CPMM amount-aware quote safety
        run: python3 -m unittest discover -s tests -p test_cpmm_quote.py -v
      - name: Test conservative residual-token valuation
        run: python3 -m unittest discover -s tests -p test_whirlpool_accounting.py -v
      - name: Test Raydium to Orca reverse route wiring
        run: python3 -m unittest discover -s tests -p test_reverse_sweep.py -v
      - name: Test jittered RPC rate-limit retries
        run: python3 -m unittest discover -s tests -p test_rpc_retries.py -v
      - name: Test on-chain transaction-history discovery
        run: python3 -m unittest discover -s tests -p test_onchain_history_discovery.py -v
      - name: Test incremental pool registry ingestion
        run: python3 -m unittest discover -s tests -p test_pool_registry_ingest.py -v
      - name: Test persistent pool registry safety checks
        run: python3 -m unittest discover -s tests -p test_pool_registry.py -v
      - name: Test Meteora DAMM v2 pool decoder and mint filters
        run: python3 -m unittest discover -s tests -p test_meteora_damm_v2.py -v
      - name: Test Meteora DLMM pool layout and mint filters
        run: python3 -m unittest discover -s tests -p test_meteora_dlmm.py -v
      - name: Test local-only lookup table guard
        run: python3 -m unittest discover -s tests -p test_clmm_local_alt.py -v
      - name: Test versioned transaction lookup-table safety
        run: python3 -m unittest discover -s tests -p test_clmm_v0.py -v
      - name: Test new recognized DEX program watchlist safety
        run: python3 -m unittest discover -s tests -p test_venue_watchlist.py -v
      - name: Test third-leg owner-aware discovery
        run: python3 -m unittest discover -s tests -p test_third_leg_owner.py -v
      - name: Test fail-closed RAY-to-WSOL third-leg readiness
        run: python3 -m unittest discover -s tests -p test_third_leg_readiness.py -v
      - name: Test fine-grained exact-output sweep
        run: python3 -m unittest discover -s tests -p test_three_hop_fine_sweep.py -v
      - name: Test bounded three-hop output sweep and unknown-fee safety
        run: python3 -m unittest discover -s tests -p test_three_hop_sweep.py -v
      - name: Test Orca exact-output return leg serialization
        run: python3 -m unittest discover -s tests -p test_orca_exact_output_return.py -v
      - name: Test CLMM simulation post-balance assertions
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_execution.py -v
      - name: Test CLMM candidate fixture safety gates
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_candidates.py -v
      - name: Test CLMM fork readiness reporting
        run: python3 -m unittest discover -s tests -p test_clmm_pool_readiness.py -v
      - name: Test CLMM tick-array PDA start and packed account layout
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_ticks.py -v
      - name: Test Raydium CLMM swap v2 instruction serialization
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_swap.py -v
      - name: Test signed CLMM swap simulation post-state verifier
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_signed_simulation.py -v
      - name: Test fail-closed authenticated CLMM live quote
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_live_quote.py -v
      - name: Test Raydium CLMM initialized tick boundaries
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_tick_decode.py -v
      - name: Test authenticated Raydium CLMM quote preflight
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_quote_preflight.py -v
      - name: Test synchronized Raydium CLMM fee configuration snapshot
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_fee_snapshot.py -v
      - name: Test conservative Raydium CLMM within-tick amount quote
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_within_tick_quote.py -v
      - name: Test Raydium CLMM packed pool decoder
        run: python3 -m unittest discover -s tests -p test_raydium_clmm.py -v
      - name: Test Raydium CLMM discovery filters
        run: python3 -m unittest discover -s tests -p test_raydium_clmm_filters.py -v
      - name: Test expanded DEX venue registry
        run: python3 -m unittest discover -s tests -p test_dex_registry.py -v
      - name: Test zero-prefixed pubkey decoding
        run: python3 -m unittest discover -s tests -p test_base58_pubkeys.py -v
      - name: Test multi-venue arbitrage graph and cycle discovery
        run: python3 -m unittest discover -s tests -p test_opportunity_graph.py -v
      - name: Test multi-token on-chain discovery filters
        run: python3 -m unittest discover -s tests -p test_onchain_pool_discovery.py -v
      - name: Test bounded route sweep and profit filter
        run: python3 -m unittest discover -s tests -p test_cross_venue_sweep.py -v
      - name: Test cross-venue safety gates
        run: python3 -m unittest discover -s tests -p test_cross_venue.py -v
      - name: Test Raydium CPMM swap instruction encoding
        run: python3 -m unittest discover -s tests -p test_raydium_swap.py -v
      - name: Test Raydium published-pool diagnostic
        run: python3 -m unittest discover -s tests -p test_raydium_candidate.py -v
      - name: Test Raydium CPMM on-chain decoder and restricted search
        run: python3 -m unittest discover -s tests -p test_raydium_cpmm.py -v
      - name: Test exact-output atomic swap instruction semantics
        run: python3 -m unittest discover -s tests -p test_whirlpool_exact_output.py -v
      - name: Test atomic Whirlpool round-trip accounting
        run: python3 -m unittest discover -s tests -p test_whirlpool_roundtrip.py -v
      - name: Test actual simulated token balance assertions
        run: python3 -m unittest discover -s tests -p test_simulated_balances.py -v
      - name: Test atomic Whirlpool simulation guardrails
        run: python3 -m unittest discover -s tests -p test_whirlpool_simulation.py -v
      - name: Test swap preflight safety gates
        run: python3 -m unittest discover -s tests -p test_whirlpool_preflight.py -v
      - name: Test Orca swap instruction payload
        run: python3 -m unittest discover -s tests -p test_whirlpool_swap.py -v
      - name: Run Whirlpool tick-array math tests
        run: python3 -m unittest discover -s tests -p test_whirlpool_ticks.py -v
      - name: Run serialized transaction replay contract tests
        run: python3 -m unittest arb.transaction_replay.ReplayTests -v
      - name: Run Whirlpool spot mathematics and market gate tests
        run: python3 -m unittest arb.whirlpool_market.MarketTests -v
      - name: Run arbitrage arithmetic tests
        env:
          RUN_SURFPOOL_INTEGRATION: '1'
        run: python3 -m unittest discover -s tests -v

      # Future: run atomic swap integration tests with forked program accounts.

      - name: Upload Surfpool log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-log
          path: ${{ runner.temp }}/surfpool.log
          if-no-files-found: ignore

  mainnet-fork-probe:
    # Secrets are unavailable to untrusted fork PRs; verify forks on trusted branches/PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLANA_RPC_URL: http://127.0.0.1:8899
      SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      # Conservative pacing for Python RPC calls to Surfpool (fork fetches may bypass it).
      SOLANA_RPC_MIN_INTERVAL_SECONDS: "0.5"
      SOLANA_RPC_ALCHEMY_FREE_TIER: "1"
      SOLANA_RPC_PACING_FILE: /tmp/solana-rpc-last-request
    steps:
      - uses: actions/checkout@v4
      - name: Check datasource is configured
        run: |
          if [ -z "$SURFPOOL_DATASOURCE_RPC_URL" ]; then
            echo "Configure repository secret SOLANA_MAINNET_RPC_URL to enable fork verification." >&2
            exit 1
          fi
      - name: Compare upstream RPC methods without retries
        # Run direct Alchemy method diagnostics only on explicit demand.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          UPSTREAM_RPC_DIAGNOSTIC_REPORT: ${{ runner.temp }}/upstream-rpc-method-diagnostic.json
        run: python3 -m arb.upstream_rpc_method_diagnostic
      - name: Upload upstream RPC method comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-rpc-method-comparison
          path: ${{ runner.temp }}/upstream-rpc-method-diagnostic.json
          if-no-files-found: ignore
      - name: Install Surfpool
        run: |
          set -euo pipefail
          bash ci/install_surfpool.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Start Surfpool mainnet fork
        run: |
          nohup surfpool start --ci --rpc-url "$SURFPOOL_DATASOURCE_RPC_URL" --no-deploy > "$RUNNER_TEMP/fork.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/fork.pid"
      - name: Wait for RPC
        run: |
          python3 - <<'PY'
          import time
          from arb.rpc import call
          for i in range(60):
              try:
                  assert call("http://127.0.0.1:8899", "getLatestBlockhash")["value"]["blockhash"]
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Surfpool fork RPC unavailable")
          PY
      - name: Install transaction serialization dependency
        run: python3 -m pip install --disable-pip-version-check solders==0.26.0
      - name: Fetch Raydium AMM v4 candidate addresses from public API
        run: python3 -m arb.raydium_public_pool_candidates --output "$RUNNER_TEMP/raydium-public-candidates.json"
      - name: Upload untrusted Raydium public API pool candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raydium-public-api-candidates
          path: ${{ runner.temp }}/raydium-public-candidates.json
          if-no-files-found: ignore
      - name: Discover indexed Orca DEX candidates without fixed token pairs
        env:
          ORCA_LEGACY_GECKO_DEX_ID: ${{ vars.ORCA_LEGACY_GECKO_DEX_ID }}
        run: |
          if [ -n "$ORCA_LEGACY_GECKO_DEX_ID" ]; then
            python3 -m arb.orca_legacy_public_candidates --dex-id "$ORCA_LEGACY_GECKO_DEX_ID" --output "$RUNNER_TEMP/orca-legacy-index-candidates.json"
          else
            python3 -m arb.orca_legacy_public_candidates --dex-id orca --output "$RUNNER_TEMP/orca-legacy-index-candidates.json"
          fi
      - name: Upload Orca legacy index discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-legacy-index-candidates
          path: ${{ runner.temp }}/orca-legacy-index-candidates.json
          if-no-files-found: error
      - name: Classify indexed Orca pools by actual onchain program owner
        run: python3 -m arb.orca_legacy_owner_preflight --rpc "$SOLANA_RPC_URL" --input "$RUNNER_TEMP/orca-legacy-index-candidates.json" --output "$RUNNER_TEMP/orca-legacy-owner-candidates.json" --report "$RUNNER_TEMP/orca-legacy-owner-report.json"
      - name: Upload Orca legacy owner classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-legacy-owner-preflight
          path: ${{ runner.temp }}/orca-legacy-owner-report.json
          if-no-files-found: error
      - name: Probe all eight pool decoders and builder availability against mainnet fork
        run: python3 -m arb.eight_venue_onchain_probe --rpc "$SOLANA_RPC_URL" --public-raydium-candidates "$RUNNER_TEMP/raydium-public-candidates.json" --public-orca-legacy-candidates "$RUNNER_TEMP/orca-legacy-owner-candidates.json" --output "$RUNNER_TEMP/eight-venue-onchain-probe.json"
      - name: Validate eight-venue probe schema and simulation-only flags
        run: python3 -m arb.validate_eight_venue_probe --input "$RUNNER_TEMP/eight-venue-onchain-probe.json"
      - name: Upload eight-venue onchain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eight-venue-onchain-verification
          path: ${{ runner.temp }}/eight-venue-onchain-probe.json
          if-no-files-found: error
      - name: Enumerate multi-pair token graph cycles
        env:
          TOKEN_GRAPH_INDEX_ENABLED: "1"
          TOKEN_GRAPH_GECKO_ENABLED: "1"
          TOKEN_GRAPH_MAX_HOPS: "4"
        run: python3 -m arb.token_cycle_graph > "${{ runner.temp }}/token-cycle-graph.json"

      - name: Upload unverified token graph candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-cycle-graph-candidates
          path: ${{ runner.temp }}/token-cycle-graph.json
          if-no-files-found: error

      - name: Verify closed token-cycle pool states
        env:
          TOKEN_GRAPH_CANDIDATES_REPORT: ${{ runner.temp }}/token-cycle-graph.json
          TOKEN_GRAPH_VERIFICATION_REPORT: ${{ runner.temp }}/token-cycle-verified.json
        run: python3 -m arb.token_cycle_verify

      - name: Upload on-chain token-cycle pool verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-cycle-onchain-verification
          path: ${{ runner.temp }}/token-cycle-verified.json
          if-no-files-found: ignore

      - name: Classify closed-cycle atomic execution readiness
        env:
          TOKEN_GRAPH_VERIFICATION_REPORT: ${{ runner.temp }}/token-cycle-verified.json
          TOKEN_GRAPH_READINESS_REPORT: ${{ runner.temp }}/token-cycle-readiness.json
        run: python3 -m arb.token_cycle_readiness

      - name: Upload closed-cycle execution readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-cycle-execution-readiness
          path: ${{ runner.temp }}/token-cycle-readiness.json
          if-no-files-found: ignore

      - name: Assess verified mixed-venue cycle builder readiness
        env:
          TOKEN_GRAPH_VERIFICATION_REPORT: ${{ runner.temp }}/token-cycle-verified.json
          TOKEN_MIXED_READINESS_REPORT: ${{ runner.temp }}/mixed-cycle-readiness.json
        run: python3 -m arb.mixed_cycle_readiness

      - name: Upload mixed-venue route readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-cycle-builder-readiness
          path: ${{ runner.temp }}/mixed-cycle-readiness.json
          if-no-files-found: ignore

      - name: Verify active Meteora bin array for selected mixed route
        env:
          TOKEN_MIXED_READINESS_REPORT: ${{ runner.temp }}/mixed-cycle-readiness.json
          TOKEN_DLMM_BIN_PREFLIGHT_REPORT: ${{ runner.temp }}/dlmm-bin-preflight.json
        run: python3 -m arb.meteora_dlmm_bin_preflight

      - name: Upload read-only Meteora bin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteora-dlmm-active-bin-preflight
          path: ${{ runner.temp }}/dlmm-bin-preflight.json
          if-no-files-found: ignore

      - name: Export read-only authenticated DLMM offline fixture
        env:
          TOKEN_DLMM_BIN_PREFLIGHT_REPORT: ${{ runner.temp }}/dlmm-bin-preflight.json
          TOKEN_DLMM_FIXTURE_EXPORT_PATH: ${{ runner.temp }}/meteora-dlmm-fixture.json
        run: python3 -m arb.meteora_dlmm_fixture_export

      - name: Upload authenticated DLMM fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteora-dlmm-readonly-offline-fixture
          path: ${{ runner.temp }}/meteora-dlmm-fixture.json
